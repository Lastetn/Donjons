}

/* ---------- joueur ---------- */
function startAttack(){
  P.combo=P.comboT>0?(P.combo%3)+1:1;
  P.at=0;P.atDur=P.combo===3?.42:.3;P.hitDone=false;P.queued=false;P.comboT=0;
  let best=null,bd=3.4;
  for(const e of enemies){
    if(e.dead||(e.kind==='boss'&&(e.state==='sleep'||e.state==='dying')))continue;
    const d=Math.hypot(e.x-P.x,e.z-P.z);
    if(d<bd&&Math.abs(angDiff(P.face,Math.atan2(e.x-P.x,e.z-P.z)))<1.3){best=e;bd=d;}
  }
  const mag=Math.hypot(IN.ix,IN.iz);
  if(best)P.face=Math.atan2(best.x-P.x,best.z-P.z);
  else if(mag>.25)P.face=Math.atan2(IN.ix,IN.iz);
  const s=P.combo===3?5:3.4;P.lx=Math.sin(P.face)*s;P.lz=Math.cos(P.face)*s;
  Snd.swing(P.x,P.z,P.combo);
  slashMat.uniforms.uDir.value=P.combo%2?-1:1;slashMat.uniforms.uProg.value=0;slashMat.uniforms.uA.value=1;slashArc.visible=true;
  slashMat.uniforms.uCol.value.set(P.combo===3?'#ffd9a0':'#bfe6ff');
}
function playerHit(){
  const heavy=P.combo===3,reach=heavy?2.5:2.1,half=heavy?1.5:1.2,dmg=heavy?2:1;
  let any=false;
  for(const e of enemies){
    if(e.dead)continue;
    const dx=e.x-P.x,dz=e.z-P.z,d=Math.hypot(dx,dz);
    if(d>reach+e.r)continue;
    if(d>e.r+.6&&Math.abs(angDiff(P.face,Math.atan2(dx,dz)))>half)continue;
    hitEnemy(e,dmg,P.x,P.z,heavy?10:6.5);any=true;
  }
  for(const p of pots){
    if(p.hp<=0)continue;
    const dx=p.x-P.x,dz=p.z-P.z,d=Math.hypot(dx,dz);
    if(d<reach&&(d<.9||Math.abs(angDiff(P.face,Math.atan2(dx,dz)))<half)){breakPot(p);any=true;}
  }
  for(let i=shots.length-1;i>=0;i--){const q=shots[i],qx=q.x-P.x,qz=q.z-P.z,qd=Math.hypot(qx,qz);if(qd<reach+.3&&(qd<.9||Math.abs(angDiff(P.face,Math.atan2(qx,qz)))<half)){removeShot(i);any=true;}}
  if(any){FX.hitstop=heavy?.09:.05;FX.shake=Math.max(FX.shake,heavy?.4:.22);}
}
function updatePlayer(dt){
  const m=P.m;
  if(P.dead){m.g.position.set(P.x,.25,P.z);return;}
  P.inv=Math.max(0,P.inv-dt);P.rollCd=Math.max(0,P.rollCd-dt);
  const slw=P.slowT>0?.55:1;P.slowT=Math.max(0,P.slowT-dt);
  IN.atkBuf=Math.max(0,IN.atkBuf-dt);IN.rollBuf=Math.max(0,IN.rollBuf-dt);
  let ix=IN.ix,iz=IN.iz;const mag=Math.hypot(ix,iz);
  if(mag>1){ix/=mag;iz/=mag;}
  if(IN.rollBuf>0&&P.rollT<=0&&P.rollCd<=0){
    const a=mag>.2?Math.atan2(ix,iz):P.face;
    P.rdx=Math.sin(a);P.rdz=Math.cos(a);P.face=a;P.rollT=.36;P.rollCd=.6;IN.rollBuf=0;
    P.at=-1;P.queued=false;slashArc.visible=false;Snd.roll(P.x,P.z);
  }
  if(IN.atkBuf>0&&P.rollT<=0){
    if(P.at<0){startAttack();IN.atkBuf=0;}
    else if(P.at>P.atDur*.4){P.queued=true;IN.atkBuf=0;}
  }
  /* mouvement */
  let tx=0,tz=0,lerpK=16;
  if(P.rollT>0){
    P.rollT-=dt;const k=Math.max(0,P.rollT/.36),s=P.dash?17:10.5*(.4+.6*k);
    P.vx=P.rdx*s;P.vz=P.rdz*s;tx=P.vx;tz=P.vz;lerpK=0;
  }else if(P.at>=0){
    const k=P.at/P.atDur,f=(1-k)*(1-k);tx=P.lx*f;tz=P.lz*f;lerpK=22;
  }else{
    tx=ix*5.4*slw;tz=iz*5.4*slw;
    if(mag>.2)P.face=lerpA(P.face,Math.atan2(ix,iz),dt*14);
  }
  if(lerpK>0){const k=Math.min(1,dt*lerpK);P.vx+=(tx-P.vx)*k;P.vz+=(tz-P.vz)*k;}
  P.kx*=Math.exp(-dt*9);P.kz*=Math.exp(-dt*9);

  const sp_=Math.hypot(P.vx,P.vz);

  if(P.rollT<=0&&P.at<0&&sp_>1.8){
    P.stride+=sp_*dt;
    if(P.stride>1.25){P.stride-=1.25;P.side=-P.side;Snd.step(P.x+P.side*.55,P.z,P.side>0?1:0);}
  }

  if(P.at>=0){
    P.at+=dt;const k=Math.min(1,P.at/P.atDur);
    if(!P.hitDone&&P.at>=.09){P.hitDone=true;playerHit();}
    const e_=1-Math.pow(1-Math.min(1,k/.78),2),dir=P.combo%2?1:-1;
    const yaw=lerp(1.5*dir,-1.5*dir,e_);
    m.sw.rotation.set(P.combo===3?.35:.08,yaw+(dir>0?-.1:.1),0);
    slashMat.uniforms.uProg.value=Math.min(1,k*1.15);slashMat.uniforms.uA.value=1-Math.max(0,(k-.55)/.45);
    if(P.at>=P.atDur){
      P.at=-1;P.comboT=.5;slashArc.visible=false;
      if(P.queued){P.queued=false;startAttack();}
    }
  }else{
    P.comboT=Math.max(0,P.comboT-dt);

    m.sw.rotation.y+=(.25-m.sw.rotation.y)*Math.min(1,dt*12);
  }
  poseHero(dt,sp_);
}

/* ---------- ramassables, porte, pièges ---------- */
function updateWorldItems(dt){
  for(let i=pickups.length-1;i>=0;i--){
    const k=pickups[i];k.t+=dt;k.life-=dt;
    k.spin.rotation.y+=dt*2.2;k.mesh.position.y=.6+Math.sin(k.t*3)*.08;
    k.mesh.visible=k.life>5||Math.floor(timeT*8)%2===0;

    if((d<.85&&P.hp<P.maxhp&&!P.dead)||k.life<=0){
      if(k.life>0){P.hp=Math.min(P.maxhp,P.hp+2);Snd.heal();emit(k.x,.8,k.z,16,'#ff7a6a',3,.7,.1,-2);updateHearts();}
      world.remove(k.mesh);flames=flames.filter(f=>f!==k.halo);pickups.splice(i,1);
    }

  if(keyItem){
    keyItem.t+=dt;keyItem.spin.rotation.y+=dt*2.4;keyItem.g.position.y=.5+Math.sin(keyItem.t*2.6)*.1;
    if(Math.hypot(keyItem.x-P.x,keyItem.z-P.z)<1.1&&!P.dead){
      P.key=true;setKey(true);Snd.key();emit(keyItem.x,.9,keyItem.z,30,'#ffd27a',5,.9,.12,-1);
      world.remove(keyItem.g);flames=flames.filter(f=>f!==keyItem.halo);keyItem=null;
      doorObj.mat.uniforms.uColor.value.set('#4cff9a');

  /* reliquaire et source */
  if(relic){
    relic.t+=dt;relic.spin.rotation.y+=dt*1.8;relic.g.position.y=1.1+Math.sin(relic.t*2.2)*.12;
    if(Math.hypot(relic.x-P.x,relic.z-P.z)<1.3&&!P.dead){
      const oldMax=P.maxhp;P.maxhp+=2;P.hp=P.maxhp;updateHearts();Snd.key();Snd.heal();
      emit(relic.x,1.2,relic.z,34,'#ffb066',5,1,.13,-1);
      world.remove(relic.g);flames=flames.filter(f=>f!==relic.halo);relic=null;
      banner('Cœur de braise','Vie maximale '+oldMax+' → '+P.maxhp,3000);
    }
  }
  if(fountain){
    fountain.msg=Math.max(0,fountain.msg-dt);
    if(Math.hypot(fountain.x-P.x,fountain.z-P.z)<2.2&&!P.dead&&!fountain.used){
      if(P.hp<P.maxhp){
        fountain.used=true;P.hp=P.maxhp;updateHearts();Snd.heal();
        emit(fountain.x,1,fountain.z,30,'#7fd4ff',4,1,.11,-1);
        fountain.water.material.uniforms.uColor.value.set('#33414d');fountain.halo.visible=false;
        banner('La source te guérit','Elle est maintenant tarie',2600);
      }else if(fountain.msg<=0){fountain.msg=6;toast('La source guérit les blessés. Reviens plus tard.');}
    }
  }
  updateTele(dt);
  if(doorObj&&doorObj.opening&&doorObj.open>=1){
    const dsh=doorObj.shut?1:-1;
    if(doorObj.shut||(doorObj.shutT||0)>0){
      const was=doorObj.shutT||0;
      doorObj.shutT=clamp(was+dsh*dt/(doorObj.shut?.4:2),0,1);
      const k=doorObj.shut?doorObj.shutT*doorObj.shutT:doorObj.shutT;
      doorObj.mesh.position.y=1.65+(1-k)*3.6;
      const near=Math.hypot(doorObj.x-P.x,doorObj.z-P.z)<1.3&&!P.dead;
      if(doorObj.shut&&doorObj.shutT>=.55&&!near)for(const c of doorObj.cells)grid[c[1]*W+c[0]]=2;
      if(doorObj.shut&&was<1&&doorObj.shutT>=1){
        Snd.slam(doorObj.x,doorObj.z);FX.shake=Math.max(FX.shake,.8);
        for(let i=0;i<14;i++)emit(doorObj.x+rnd(-1,1),.15,doorObj.z+rnd(-1,1),1,'#9a8f80',2.5,.9,.14,-.5);
      }
      if(!doorObj.shut&&doorObj.shutT<.9)for(const c of doorObj.cells)grid[c[1]*W+c[0]]=1;
    }
  }
  /* porte */
  if(doorObj){
    const dd=Math.hypot(doorObj.x-P.x,doorObj.z-P.z);G.lockedCd=Math.max(0,G.lockedCd-dt);
    if(!doorObj.opening){
      if(P.key&&dd<3.6){doorObj.opening=true;Snd.door(doorObj.x,doorObj.z);}
      else if(!P.key&&dd<2.4&&G.lockedCd<=0){G.lockedCd=3;Snd.locked(doorObj.x,doorObj.z);toast('La porte est scellée. Il faut une clé.');}
    }else if(doorObj.open<1){

      doorObj.mesh.position.y=1.65+doorObj.open*3.6;
      if(doorObj.open>.4)for(const c of doorObj.cells)grid[c[1]*W+c[0]]=1;
      if(Math.random()<dt*14)emit(doorObj.x,.2,doorObj.z+rnd(-1,1),1,'#9a8f80',1.5,.8,.12,-.5);
    }
  }
  /* pointes */
  for(const s of spikes){
    if(Math.abs(s.x-P.x)>30||Math.abs(s.z-P.z)>30)continue;
    const ph=((timeT+s.ph0+s.row*1.6)%3.2+3.2)%3.2;
    let h=0;
    if(ph>=1.4&&ph<2.0)h=.1+.03*Math.sin(timeT*70);else if(ph>=2.0&&ph<2.7)h=1;else if(ph>=2.7)h=1-(ph-2.7)/.5;
    const up=ph>=2.0&&ph<2.7,first=s.first;
    if(up&&!s.wasUp&&first)Snd.spike(s.x,s.z);
    if(!up&&ph>=1.4&&ph<1.43&&first&&!s.rat){s.rat=true;Snd.rattle(s.x,s.z);}
    if(ph<1.4)s.rat=false;
    s.wasUp=up;
    for(const c of s.cones){c.scale.y=Math.max(.01,h);c.position.y=.475*h;}
    if(up&&Math.floor(P.x)===Math.floor(s.x)&&Math.floor(P.z)===Math.floor(s.z))hurtPlayer(1,s.x,s.z);
  }
  /* ondes de choc du boss */
  for(let i=shocks.length-1;i>=0;i--){
    const s=shocks[i];
    if(s.delay>0){s.delay-=dt;s.mesh.visible=false;continue;}
    if(!s.started){s.started=true;Snd[s.snd||'slam'](s.x,s.z);FX.shake=Math.max(FX.shake,s.shk||.7);}
    s.mesh.visible=true;s.r+=dt*(s.sp||9.5);
    s.mesh.position.set(s.x,.08,s.z);s.mesh.scale.set(s.r,1,s.r);
    s.mesh.material.uniforms.uA.value=clamp(1-(s.r-s.r0)/(s.max-s.r0),0,1);
    if(s.friendly){
      if(s.pdmg>0)for(const e of enemies){if(e.dead||s.hs.has(e))continue;if(Math.abs(Math.hypot(e.x-s.x,e.z-s.z)-s.r)<s.band+e.r){s.hs.add(e);hitEnemy(e,s.pdmg,s.x,s.z,s.kb||8);}}
      if(s.r>=s.max){world.remove(s.mesh);shocks.splice(i,1);}
      continue;
    }
    const d=Math.hypot(P.x-s.x,P.z-s.z);
    if(!s.hit&&Math.abs(d-s.r)<(s.band||.8)&&hurtPlayer(s.dmg||2,s.x,s.z))s.hit=true;
    if(s.r>=s.max){world.remove(s.mesh);shocks.splice(i,1);}
  }
}

/* ---------- ennemis ---------- */
function steer(e,tx,tz,speed,dt){
  const dx=tx-e.x,dz=tz-e.z,d=Math.hypot(dx,dz)||1,base=Math.atan2(dx/d,dz/d);
  const offs=[0,.6,-.6,1.2,-1.2,1.9,-1.9];
  for(let i=0;i<offs.length;i++){
    const a=base+offs[i],vx=Math.sin(a),vz=Math.cos(a);
    if(!blocked(e.x+vx*.45,e.z+vz*.45,e.r)){move(e,vx*speed*dt,vz*speed*dt,e.r);return a;}
  }
  return base;
}
function updSlime(e,dt){
  const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz);
  const seen=d<9&&los(e.x,e.z,P.x,P.z)&&!P.dead;
  e.g.position.set(e.x,0,e.z);e.g.rotation.y=e.face;
  if(e.state==='idle'){
    e.body.scale.set(1,.85+Math.sin(timeT*2+e.x)*.04,1);
    if(seen){e.state='hunt';e.t=.45;}
    return;
  }
  if(e.state==='hunt'){
    e.t-=dt;e.face=lerpA(e.face,Math.atan2(dx,dz),dt*8);
    e.body.scale.set(1+Math.sin(timeT*9)*.05,.85+Math.sin(timeT*9)*.08,1);
    if(!seen){e.lost+=dt;if(e.lost>4){e.state='idle';e.lost=0;}}else e.lost=0;
    if(e.t<=0){e.state='hop';e.hopT=0;e.dir=Math.atan2(dx,dz);Snd.slimeHop(e.x,e.z);}
  }else if(e.state==='hop'){
    e.hopT+=dt/.5;
    const k=Math.min(1,e.hopT),s=Math.sin(Math.PI*k);
    steer(e,e.x+Math.sin(e.dir)*3,e.z+Math.cos(e.dir)*3,3.7,dt);
    e.g.position.y=s*.65;e.body.scale.set(1-.12*s,.85+.3*s,1-.12*s);e.face=lerpA(e.face,e.dir,dt*10);
    if(d<e.r+.45&&e.g.position.y<.7)hurtPlayer(1,e.x,e.z);
    if(k>=1){e.state='hunt';e.t=rnd(.5,.95);emit(e.x,.1,e.z,8,'#6dff7a',2.5,.4,.1,6);e.body.scale.set(1.15,.7,1.15);}
  }
}
function updSkel(e,dt){
  const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),pa=Math.atan2(dx,dz);
  const seen=d<10&&los(e.x,e.z,P.x,P.z)&&!P.dead;
  e.cd-=dt;let armR=-.2,sw=0;

  }else if(e.state==='chase'){
    if(seen)e.aggro=4;else e.aggro-=dt;
    if(e.aggro<=0){e.state='idle';}
    else{
      steer(e,P.x,P.z,2.6,dt);e.face=lerpA(e.face,pa,dt*8);e.walk+=dt*8;sw=Math.sin(e.walk)*.7;
      if(d<1.6&&e.cd<=0){e.state='wind';e.t=.55;Snd.rattle(e.x,e.z);Snd.clack(e.x,e.z,2);}

    e.t-=dt;e.face=lerpA(e.face,pa,dt*10);armR=-2.3*(1-e.t/.55)-.2;
    for(const u of e.fu)u.uWarn.value=.9;
    if(e.t<=0){e.state='strike';e.t=.18;e.hitDone=false;Snd.swing(e.x,e.z,1);for(const u of e.fu)u.uWarn.value=0;}
  }else if(e.state==='strike'){

    move(e,Math.sin(e.face)*5.8*dt,Math.cos(e.face)*5.8*dt,e.r);
    if(!e.hitDone&&d<1.5&&Math.abs(angDiff(e.face,pa))<1){e.hitDone=hurtPlayer(1,e.x,e.z)||e.hitDone;}
    if(e.t<=0){e.state='rec';e.t=.65;}
  }else if(e.state==='rec'){
    e.t-=dt;armR=.4;if(e.t<=0){e.state='chase';e.cd=.9;}
  }
  e.g.position.set(e.x,0,e.z);e.g.rotation.y=e.face;
  e.legL.rotation.x=sw;e.legR.rotation.x=-sw;
  e.armR.rotation.x+=(armR-e.armR.rotation.x)*Math.min(1,dt*18);e.armL.rotation.x=-sw*.6;
  {const m_=Math.abs(sw),stk=e.state==='strike'?.6:0;
   spr(e.sF,-.1-m_*.45-stk,dt,70,9);spr(e.sB,.1+m_*.45+stk*.5,dt,70,9);spr(e.sP,.12+m_*.5+stk+Math.sin(timeT*4+e.x)*.05,dt,45,6);
   e.clothF.rotation.x=e.sF.a;e.clothB.rotation.x=e.sB.a;e.plume.rotation.x=e.sP.a;e.plume.rotation.z=Math.sin(timeT*3+e.z)*.08;}
}

function doSlam(e){

  const SH=e.def.shots;
  if(SH){const pa=Math.atan2(P.x-e.x,P.z-e.z);for(let k=0;k<SH.n;k++){const a=SH.aim?pa+(k-(SH.n-1)/2)*(SH.spread||.3):k/SH.n*TAU;fireShot(e,a,{c1:SH.c1,c2:SH.c2,sp:SH.sp,oy:1.2,off:e.r+.3,silent:k>0});}}
  FX.hitstop=.05;
  for(let k=0;k<16;k++){const a=k/16*TAU;emit(e.x+Math.cos(a)*1.4,.1,e.z+Math.sin(a)*1.4,2,e.def.fx,5,.8,.16,8);}
  FX.fl=.4;FX.flx=e.x;FX.flz=e.z;FX.flc=e.def.fl;

function updBoss(e,dt){
  const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),pa=Math.atan2(dx,dz);

    case 'dying':{

  }

  {const minD=e.r+.4;if(d<minD){const k=(minD-d)/Math.max(.01,d);move(P,dx*k,dz*k,.32);}}

  for(const m of e.eyes){m.material.uniforms.uColor.value.setRGB(e.eyeCol[0]*eye,e.eyeCol[1]*eye,e.eyeCol[2]*eye);}
  e.g.position.y=0;
}

function updateEnemies(dt){
  for(const e of enemies){
    if(e.dead)continue;
    if(e.flash>0&&e.kind!=='boss'||e.kind==='boss'&&e.state!=='dying'){
      e.flash=Math.max(0,e.flash-dt*7);
      for(const u of e.fu)u.uFlash.value=e.flash;
    }else if(e.kind==='boss'){for(const u of e.fu)u.uFlash.value=e.flash;}
    if(e.kind!=='boss'&&(e.vx||e.vz)){
      move(e,e.vx*dt,e.vz*dt,e.r);const f=Math.exp(-dt*10);e.vx*=f;e.vz*=f;
      if(Math.abs(e.vx)+Math.abs(e.vz)<.05)e.vx=e.vz=0;
    }
    if(e.stun>0){
      e.stun-=dt;if(e.hold>0)e.hold-=dt;
      if(e.froz>0){e.froz-=dt;for(const u of e.fu)u.uFlash.value=.4;}
      if(e.kind==='slime'){e.g.position.set(e.x,0,e.z);e.body.scale.set(1.15,.7,1.15);}
      else{e.g.position.set(e.x,0,e.z);}
      continue;
    }
    ENEMY_UPD[e.kind](e,dt);
  }
  /* séparation */
  for(let i=0;i<enemies.length;i++){
    const a=enemies[i];if(a.dead||a.kind==='boss')continue;
    for(let j=i+1;j<enemies.length;j++){
      const b=enemies[j];if(b.dead||b.kind==='boss')continue;
      const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz),m=a.r+b.r;
      if(d<m&&d>.001){const p=(m-d)*.5/d;move(a,-dx*p,-dz*p,a.r);move(b,dx*p,dz*p,b.r);}
    }
  }
}

/* ---------- lumières dynamiques ---------- */
function updateLights(dt){
  FX.dark=Math.max(0,(FX.dark||0)-dt);LP[0].set(P.x,1.9,P.z,8.5*(CUR.lp||1)*(P.eyeT>0?3.2:1)*(1-.6*Math.min(1,FX.dark*2)));LC[0].set(1,.78,.52).multiplyScalar(1.15+.08*Math.sin(timeT*9));
  if(FX.fl>0){FX.fl=Math.max(0,FX.fl-dt*2.2);LP[1].set(FX.flx,1.5,FX.flz,9);LC[1].set(FX.flc[0],FX.flc[1],FX.flc[2]).multiplyScalar(FX.fl*3);}
  else LP[1].set(0,0,0,0);
  if(boss&&!boss.dead&&boss.state!=='sleep'){LP[2].set(boss.x,2.6,boss.z,10*(CUR.lb||1));LC[2].set(CUR.bl[0],CUR.bl[1],CUR.bl[2]).multiplyScalar((boss.phase===2?1.5:1)*(1+.2*Math.sin(timeT*5)));}
  else if(keyItem){LP[2].set(keyItem.x,1.2,keyItem.z,6);LC[2].set(1.1,.8,.3);}
  else LP[2].set(0,0,0,0);
  for(const t of torches)t.d=(t.x-P.x)*(t.x-P.x)+(t.z-P.z)*(t.z-P.z);
  const sorted=torches.slice().sort((a,b)=>a.d-b.d);
  for(let i=0;i<NL-3;i++){
    const t=sorted[i],k=3+i;
    if(!t){LP[k].set(0,0,0,0);continue;}
    const f=.86+.1*Math.sin(timeT*11+t.seed)+.06*Math.sin(timeT*27+t.seed*3);
    LP[k].set(t.x,t.y,t.z,10.5*(CUR.lt||1)*(t.k||1));LC[k].set(CUR.tc[0],CUR.tc[1],CUR.tc[2]).multiplyScalar(2.3*f);
  }
  Snd.updateFire(sorted.slice(0,2),P.x,P.z,dt);
}

function hmRng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hmCv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
function hmDisc(x,cx,cy,r,col){x.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));x.fillRect(cx-w,cy+y,2*w+1,1);}}

/* couches du décor, générées une fois par taille d'écran */
function hmBuild(W,H){
  const rnd=hmRng(11),GY=Math.round(H*.79),HZ=Math.round(H*.64),L={W:W,H:H,GY:GY,HZ:HZ,win:[],torch:[]};
  /* ciel en bandes */
  const sky=hmCv(W,H),s=sky.getContext('2d');
  const bands=['#0c0716','#120a20','#1a0c28','#260f2e','#38123a','#52163a','#721f36','#982c32','#c0402c','#e46228','#ff9440'];
  const bh=Math.ceil(HZ/bands.length);
  bands.forEach((c,i)=>{s.fillStyle=c;s.fillRect(0,i*bh,W,bh+1);if(i){s.fillStyle=bands[i-1];for(let x=(i&1);x<W;x+=2)s.fillRect(x,i*bh,1,1);}});
  s.fillStyle='#2a0f1c';s.fillRect(0,HZ,W,H-HZ);
  const mx=Math.round(W*.76),my=Math.round(HZ*.42),mr=Math.round(H*.13);
  for(let k=5;k>=1;k--){s.globalAlpha=.07;hmDisc(s,mx,my,mr+k*5,'#ff8a3a');}
  s.globalAlpha=1;hmDisc(s,mx,my,mr,'#ffb46a');hmDisc(s,mx-3,my-2,mr-4,'#ffcf8a');
  s.fillStyle='#e8935a';[[-6,4,5],[4,-6,4],[8,6,3],[-10,-5,3]].forEach(c=>hmDisc(s,mx+c[0],my+c[1],c[2]>>1,'#e8935a'));
  L.sky=sky;
  /* montagnes lointaines : périodiques, défilent en boucle */
  const mk=(Wl,base,amp,col,seed,ks)=>{
    const c=hmCv(Wl,H),x=c.getContext('2d'),r=hmRng(seed),ph=ks.map(()=>r()*6.28);x.fillStyle=col;
    for(let i=0;i<Wl;i++){let v=0;ks.forEach((k,j)=>{v+=Math.sin(6.2832*k*i/Wl+ph[j])/(1+j*.7);});
      const t=Math.round(base-amp*(.5+.3*v));x.fillRect(i,t,1,H-t);}
    return c;};
  L.far=mk(W*2,HZ+2,34,'#2c1236',3,[2,3,5,9]);
  L.far2=mk(W*2,HZ+6,24,'#1d0e28',8,[3,5,8,13]);
  /* colline, château, arbres morts : fixes */
  const mid=hmCv(W,H),m=mid.getContext('2d');
  const hill=(x0,x1,top,col)=>{m.fillStyle=col;for(let i=x0;i<x1;i++){const u=(i-x0)/(x1-x0),t=Math.round(top+(1-Math.sin(u*Math.PI))*18);m.fillRect(i,t,1,H-t);}};
  const cx=Math.round(W*.26),cy=HZ-8;
  hill(cx-70,cx+70,cy,'#150a1c');
  const K='#0f0715',E='#241030',R=(x,y,w,h,c)=>{m.fillStyle=c;m.fillRect(cx+x,cy+y,w,h);};
  R(-14,-30,28,34,K);R(-22,-42,9,46,K);R(13,-50,9,54,K);R(-5,-40,10,12,K);
  for(let i=0;i<7;i++){R(-14+i*4,-33,2,3,K);}
  for(let i=0;i<3;i++){R(-22+i*4,-45,2,3,K);R(13+i*4,-53,2,3,K);}
  for(let r=0;r<8;r++){const w=Math.max(2,10-r|0);R(-(w>>1),-52+r,w,1,K);}
  R(0,-60,1,9,K);R(1,-60,5,3,'#a02a24');
  R(-4,-26,1,0,E);R(-22,-42,1,46,E);R(21,-50,1,54,E);
  [[-9,-22],[7,-22],[-18,-36],[16,-44],[0,-36],[-2,-10]].forEach(w=>L.win.push({x:cx+w[0],y:cy+w[1],w:3,h:4}));
  /* arbres morts */
  const tree=(x,y,sc)=>{m.fillStyle='#0d0612';m.fillRect(x,y-14*sc,2*sc|0||2,14*sc);for(let b=0;b<4;b++){const d=b%2?1:-1,ln=(6-b)*sc;for(let i=0;i<ln;i++)m.fillRect(x+d*i,y-(14-b*3)*sc-(i>>1),1,1);}};
  hill(Math.round(W*.62),Math.round(W*1.12),HZ+6,'#120a18');
  hill(-60,Math.round(W*.2),HZ+8,'#120a18');
  [.04,.12,.7,.86,.95].forEach((u,i)=>tree(Math.round(W*u),HZ+14+(i%2)*4,i%3===2?2:1));
  L.mid=mid;
  /* sol : chemin de pierre, herbes, tombes */
  const gr=hmCv(W,H),g=gr.getContext('2d');
  g.fillStyle='#1c0f18';g.fillRect(0,GY,W,H-GY);
  g.fillStyle='#26141f';g.fillRect(0,GY,W,2);
  g.fillStyle='#34192a';g.fillRect(0,GY+2,W,1);
  const pt=GY+9;g.fillStyle='#3a2230';g.fillRect(0,pt,W,Math.round(H*.12));g.fillStyle='#2e1a26';g.fillRect(0,pt,W,1);
  for(let i=0;i<W/5;i++){const x=Math.floor(rnd()*W),y=pt+2+Math.floor(rnd()*(H*.1));g.fillStyle=rnd()<.5?'#4a2c3a':'#2a1620';g.fillRect(x,y,2+(rnd()*3|0),1);}
  for(let i=0;i<W/3;i++){const x=Math.floor(rnd()*W),y=GY+3+Math.floor(rnd()*5);g.fillStyle='#43301c';g.fillRect(x,y,1,1+(rnd()*2|0));}
  g.fillStyle='#120912';g.fillRect(0,H-12,W,12);
  L.ground=gr;
  /* avant-plan : tombes et herbes (devant les monstres) */
  const fg=hmCv(W,H),f=fg.getContext('2d');
  for(let i=0;i<W/22;i++){const x=Math.floor(rnd()*W),y=H-2;f.fillStyle='#0a050a';
    if(rnd()<.2){f.fillRect(x,y-9,6,9);f.fillRect(x+1,y-10,4,1);f.fillRect(x+2,y-11,2,1);}
    else for(let b=0;b<4;b++){f.fillRect(x+b*2,y-3-(rnd()*5|0),1,6);}}
  L.fg=fg;
  for(let i=0;i<70;i++)L.torch.push({x:rnd()*W,y:rnd()*HZ*.7,p:rnd()*6.28,s:.5+rnd()});
  return L;
}

const HM_SPEED={knight:24,skel:20,slime:14,spider:30,wolf:42,mage:18,golem:12};
const HM_KINDS=['skel','slime','spider','wolf','mage','golem','knight'];

function hmSpawn(){
  const dir=Math.random()<.5?1:-1,n=Math.random()<.4?2:1,W=HM.W,ks=HM_KINDS.slice();
  let x=dir>0?-30:W+30;
  for(let i=0;i<n;i++){
    const k=ks.splice(Math.floor(Math.random()*ks.length),1)[0];
    HM.units.push({k:k,x:x,dir:dir,y:HM.L.GY+14+Math.round(Math.random()*12),sp:HM_SPEED[k]*(.9+Math.random()*.2),t0:Math.random()*5});
    x-=dir*(26+Math.random()*16);
  }
  HM.spawn=7+Math.random()*7;
}
function hmInit(){
  HM.units=[];HM.t=0;HM.spawn=1.2;HM.bat=8+Math.random()*6;HM.emb=[];
  for(let i=0;i<44;i++)HM.emb.push({x:Math.random(),y:Math.random(),v:6+Math.random()*10,s:Math.random()*6,c:Math.random()});
  HM.clouds=[];for(let i=0;i<5;i++)HM.clouds.push({x:Math.random(),y:.08+Math.random()*.3,w:30+Math.random()*50,v:1+Math.random()*2});
  HM.W=0;
}
function hmFit(){
  const c=HM.c,cw=c.clientWidth||800,ch=c.clientHeight||400;
  const W=Math.max(260,Math.min(620,Math.round(HM.H*cw/ch)));
  if(W!==HM.W){HM.W=W;c.width=W;c.height=HM.H;HM.L=hmBuild(W,HM.H);HM.x=c.getContext('2d');}
}
function homeTick(dt){
  const c=$('hmC');if(!c){homeOn=false;return;}
  HM.c=c;hmFit();if(!HM.x||!HM.L)return;
  dt=Math.min(dt,.05);HM.t+=dt;
  const X=HM.x,L=HM.L,W=HM.W,H=HM.H,t=HM.t;
  X.drawImage(L.sky,0,0);
  /* étoiles */
  for(const s of L.torch){const a=.35+.65*Math.abs(Math.sin(t*s.s+s.p));X.globalAlpha=a*(1-s.y/(L.HZ*.7))*.9;X.fillStyle='#ffe8c8';X.fillRect(s.x|0,s.y|0,1,1);}
  X.globalAlpha=1;
  /* nuages */
  for(const cl of HM.clouds){cl.x+=cl.v*dt/W;if(cl.x>1.2)cl.x=-.2;const x=Math.round(cl.x*W),y=Math.round(cl.y*H);
    X.fillStyle='rgba(60,18,50,.75)';X.fillRect(x,y,cl.w,3);X.fillRect(x+6,y-2,cl.w-14,2);X.fillRect(x+12,y+3,cl.w-26,2);
    X.fillStyle='rgba(255,140,70,.18)';X.fillRect(x+4,y,cl.w-10,1);}
  /* montagnes en boucle lente */
  const o1=Math.floor(t*2.5)%(W*2),o2=Math.floor(t*5)%(W*2);
  X.drawImage(L.far,-o1,0);X.drawImage(L.far,W*2-o1,0);
  X.drawImage(L.far2,-o2,0);X.drawImage(L.far2,W*2-o2,0);
  X.drawImage(L.mid,0,0);
  /* fenêtres du château et brume */
  for(const w of L.win){const fl=.55+.45*Math.sin(t*7+w.x*3)*Math.sin(t*3.3+w.y);X.fillStyle='rgba(255,170,60,'+(.5+.5*fl).toFixed(2)+')';X.fillRect(w.x,w.y,w.w,w.h);}
  for(let i=0;i<4;i++){X.fillStyle='rgba(255,130,60,'+(.05+i*.012)+')';X.fillRect(0,L.HZ-10+i*5,W,5);}
  X.drawImage(L.ground,0,0);
  /* chauve-souris */
  HM.bat-=dt;
  if(HM.bat<=0&&!HM.batU){HM.batU={x:-10,y:20+Math.random()*30,v:36+Math.random()*20,ph:Math.random()*6};}
  if(HM.batU){const b=HM.batU;b.x+=b.v*dt;const y=Math.round(b.y+Math.sin(t*2+b.ph)*8),f=Math.sin(t*22)>0;
    X.fillStyle='#07040c';X.fillRect(Math.round(b.x),y,3,2);if(f){X.fillRect(Math.round(b.x)-4,y-2,4,1);X.fillRect(Math.round(b.x)+3,y-2,4,1);}else{X.fillRect(Math.round(b.x)-4,y+1,4,1);X.fillRect(Math.round(b.x)+3,y+1,4,1);}
    if(b.x>W+12){HM.batU=null;HM.bat=14+Math.random()*10;}}
  /* défilé de monstres */
  HM.spawn-=dt;if(HM.spawn<=0&&HM.units.length<3)hmSpawn();
  HM.units.sort((a,b)=>a.y-b.y);
  for(let i=HM.units.length-1;i>=0;i--){
    const u=HM.units[i];u.x+=u.dir*u.sp*dt;
    if((u.dir>0&&u.x>W+40)||(u.dir<0&&u.x<-40)){HM.units.splice(i,1);continue;}
  }
  for(const u of HM.units){
    const f=Math.floor((t+u.t0)*(u.k==='golem'?3:u.k==='wolf'?9:5))&1;
    X.save();X.translate(Math.round(u.x),u.y);
    X.fillStyle='rgba(0,0,0,.4)';X.fillRect(-7,0,14,1);
    X.scale(u.dir,1);HMS[u.k](X,f,t+u.t0);X.restore();
  }
  X.drawImage(L.fg,0,0);
  /* braises */
  for(const e of HM.emb){e.y-=e.v*dt/H;if(e.y<-.05){e.y=1.02;e.x=Math.random();}
    const x=Math.round(e.x*W+Math.sin(t*1.2+e.s)*5),y=Math.round(e.y*H);
    X.fillStyle=e.c<.5?'#ffb050':'#ff6a2a';X.globalAlpha=.4+.5*Math.abs(Math.sin(t*3+e.s));X.fillRect(x,y,1,1);}

function barStep(fill,trail,hold,t,dt){
  if(t<fill-.0001){hold=.55;fill=t;}else fill+=(t-fill)*Math.min(1,dt*6);
  if(hold>0)hold-=dt;else trail=Math.max(fill,trail-dt*.45);
  if(trail<fill)trail=fill;
  return [fill,trail,hold];
}

const SAVE_KEY='cdv_saves_v1',MAX_SAVES=16;

function saveRun(){
  if(!RUN.id)return false;
  const a=readSaves(),i=a.findIndex(s=>s.id===RUN.id);
  const s={id:RUN.id,seed:L.baseSeed,level:G.level,maxhp:P.maxhp,powers:P.powers.slice(),slots:P.slots.slice(),pi:P.pi,ts:Date.now(),start:i>=0?a[i].start:Date.now()};
  if(i>=0)a[i]=s;else{if(a.length>=MAX_SAVES)return false;a.push(s);}

}

  if(readSaves().length>=MAX_SAVES){savesScreen(G.state==='dead'?'death':G.state==='pause'?'pause':'title','Les 16 emplacements sont pleins : supprime une partie pour en commencer une nouvelle.');return;}

/* carte : brouillard de guerre, centrée sur le joueur */
const mmC=$('mm'),mmX=mmC.getContext('2d');let mmT=0;
function updateMini(dt){
  const px=Math.floor(P.x),pz=Math.floor(P.z);
  for(let z=pz-6;z<=pz+6;z++)for(let x=px-6;x<=px+6;x++){
    if(x>=0&&z>=0&&x<W&&z<H&&(x-px)*(x-px)+(z-pz)*(z-pz)<=36)seen[z*W+x]=1;
  }
  mmT-=dt;if(mmT>0)return;mmT=.1;
  const S=3,cw=(mmC.width/S)|0,ch=(mmC.height/S)|0,ox=px-(cw>>1),oz=pz-(ch>>1);
  mmX.clearRect(0,0,mmC.width,mmC.height);
  for(let z=0;z<ch;z++)for(let x=0;x<cw;x++){
    const gx=ox+x,gz=oz+z;if(gx<0||gz<0||gx>=W||gz>=H)continue;
    const i=gz*W+gx;if(!seen[i])continue;
    const v=grid[i];if(v===0)continue;
    let col='#4b5270';
    const rid=roomMap[i];
    if(rid){const t=L.rooms[rid-1].type;if(t==='boss')col='#7a4038';else if(t==='key')col='#8a7438';else if(t==='fountain')col='#3d7aa0';else if(t==='relic')col='#8a5030';else if(t==='tele')col='#5a60c0';}
    if(v===2)col=P.key?'#4cff9a':'#ff5a48';
    mmX.fillStyle=col;mmX.fillRect(x*S,z*S,S,S);
  }
  mmX.fillStyle='#ffd9a0';mmX.fillRect((px-ox)*S-1,(pz-oz)*S-1,S+2,S+2);
}

/* carte en grand : toucher la mini-carte (ou touche M) */
const bigM=$('bigmap'),bmc=$('bmc'),bmx=bmc.getContext('2d');
function drawBigMap(){
  let x0=W,x1=-1,z0=H,z1=-1;
  for(let z=0;z<H;z++)for(let x=0;x<W;x++)if(seen[z*W+x]&&grid[z*W+x]!==0){if(x<x0)x0=x;if(x>x1)x1=x;if(z<z0)z0=z;if(z>z1)z1=z;}
  if(x1<0){x0=x1=Math.floor(P.x);z0=z1=Math.floor(P.z);}
  x0=Math.max(0,x0-2);z0=Math.max(0,z0-2);x1=Math.min(W-1,x1+2);z1=Math.min(H-1,z1+2);
  const bw=x1-x0+1,bh=z1-z0+1;
  const S=Math.max(3,Math.min(18,Math.floor(Math.min(window.innerWidth*.9/bw,window.innerHeight*.66/bh))));
  bmc.width=bw*S;bmc.height=bh*S;
  bmx.fillStyle='#07090d';bmx.fillRect(0,0,bmc.width,bmc.height);
  const sn=(x,z)=>x>=0&&z>=0&&x<W&&z<H&&seen[z*W+x]&&grid[z*W+x]!==0;
  for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++){
    const i=z*W+x,v=grid[i],dx=(x-x0)*S,dz=(z-z0)*S;
    if(v===0){if(sn(x+1,z)||sn(x-1,z)||sn(x,z+1)||sn(x,z-1)){bmx.fillStyle='#1d2234';bmx.fillRect(dx,dz,S,S);}continue;}
    if(!seen[i])continue;
    let col='#4b5270';const rid=roomMap[i];
    if(rid){const t=L.rooms[rid-1].type;if(t==='boss')col='#7a4038';else if(t==='key')col='#8a7438';else if(t==='fountain')col='#3d7aa0';else if(t==='relic')col='#8a5030';else if(t==='tele')col='#5a60c0';}
    if(v===2)col=P.key?'#4cff9a':'#ff5a48';
    bmx.fillStyle=col;bmx.fillRect(dx,dz,S,S);
    if(S>=6&&((x+z)&1)){bmx.fillStyle='rgba(255,255,255,.04)';bmx.fillRect(dx,dz,S,S);}
  }
  const cx=(P.x-x0)*S,cz=(P.z-z0)*S,r=Math.max(4,S*.7);
  bmx.save();bmx.translate(cx,cz);bmx.rotate(-P.face);
  bmx.fillStyle='#ffd9a0';bmx.strokeStyle='#000';bmx.lineWidth=1.5;
  bmx.beginPath();bmx.moveTo(0,r*1.4);bmx.lineTo(r,-r);bmx.lineTo(0,-r*.4);bmx.lineTo(-r,-r);bmx.closePath();bmx.fill();bmx.stroke();
  bmx.restore();
  $('bmT').textContent='Carte · '+(CUR&&CUR.name?CUR.name:'')+' · étage '+G.level;
}

const keys={};
const KMAP={ArrowUp:'u',KeyW:'u',KeyZ:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',KeyQ:'l',ArrowRight:'r',KeyD:'r'};
window.addEventListener('keydown',e=>{
  const k=KMAP[e.code];
  if(k){keys[k]=true;e.preventDefault();}
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='KeyJ'){IN.atkBuf=.25;e.preventDefault();}
  else if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyK'){IN.rollBuf=.25;e.preventDefault();}
  else if(SLOTKEY[e.code]!==undefined){SLOTS[SLOTKEY[e.code]].start('k'+SLOTKEY[e.code]);e.preventDefault();}
  else if(e.code==='KeyM'){bigM.hidden?openMap():closeMap();e.preventDefault();}
  else if((e.code==='Escape'||e.code==='KeyP')&&!bigM.hidden){closeMap();}
  else if(e.code==='Escape'||e.code==='KeyP'){G.state==='pause'?resumeGame():pauseGame();}
  else if(e.code==='Enter'&&G.state==='title')startGame();
});
window.addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)keys[k]=false;
  if(SLOTKEY[e.code]!==undefined)SLOTS[SLOTKEY[e.code]].end('k'+SLOTKEY[e.code],false);});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

const stick={id:null,cx:0,cy:0,x:0,z:0};
const zone=$('stickZone'),sBase=$('stickBase'),sKnob=$('stickKnob');
const SR=58;
zone.addEventListener('pointerdown',e=>{
  if(stick.id!==null)return;e.preventDefault();
  stick.id=e.pointerId;stick.cx=e.clientX;stick.cy=e.clientY;stick.x=stick.z=0;
  try{zone.setPointerCapture(e.pointerId);}catch(err){}
  const r=zone.getBoundingClientRect();
  sBase.style.left=(e.clientX-r.left)+'px';sBase.style.top=(e.clientY-r.top)+'px';
  sKnob.style.transform='translate(0,0)';sBase.classList.add('on');
});
zone.addEventListener('pointermove',e=>{
  if(e.pointerId!==stick.id)return;e.preventDefault();
  let dx=e.clientX-stick.cx,dy=e.clientY-stick.cy;const d=Math.hypot(dx,dy);
  if(d>SR){stick.cx+=dx/d*(d-SR);stick.cy+=dy/d*(d-SR);dx=dx/d*SR;dy=dy/d*SR;
    const r=zone.getBoundingClientRect();sBase.style.left=(stick.cx-r.left)+'px';sBase.style.top=(stick.cy-r.top)+'px';}
  sKnob.style.transform='translate('+dx+'px,'+dy+'px)';
  let m=Math.hypot(dx,dy)/SR;m=m<.18?0:Math.min(1,(m-.18)/.82);
  const a=Math.atan2(dy,dx);stick.x=Math.cos(a)*m;stick.z=Math.sin(a)*m;
});
function stickEnd(e){if(e.pointerId!==stick.id)return;stick.id=null;stick.x=stick.z=0;sBase.classList.remove('on');}
zone.addEventListener('pointerup',stickEnd);zone.addEventListener('pointercancel',stickEnd);
function bindBtn(el,fn){
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('down');fn();});
  const up=()=>el.classList.remove('down');
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);
}
bindBtn($('btnAtk'),()=>{IN.atkBuf=.25;});
bindBtn($('btnRoll'),()=>{IN.rollBuf=.25;});

/* ---------- roue des pouvoirs (assignation des raccourcis) ---------- */
const WHEEL={on:false,sel:0,src:'',slot:0,moved:false,cx:0,cy:0,t:0};
function wheelBuild(){
  const w=$('pwWheel'),c=w.querySelector('.wc');c.querySelectorAll('.sl').forEach(n=>n.remove());
  const n=P.powers.length,big=n>6,R=big?Math.min(window.innerHeight*.34,150):Math.min(window.innerWidth*.3,130),SZ=big?50:64;
  for(let i=0;i<n;i++){
    const pw=POWERS[P.powers[i]],a=-Math.PI/2+i/n*Math.PI*2,d=document.createElement('div');
    d.className='sl';d.style.setProperty('--c',pw.col);d.textContent=pw.ic;{const sj=P.slots.indexOf(pw.id);if(sj>=0)d.dataset.s=sj+1;}
    d.style.left=(Math.cos(a)*R)+'px';d.style.top=(Math.sin(a)*R)+'px';if(big){d.style.width=d.style.height=SZ+'px';d.style.margin=(-SZ/2)+'px 0 0 '+(-SZ/2)+'px';d.style.fontSize='24px';}
    if((P.pcd[pw.id]||0)>0)d.classList.add('cd');
    c.appendChild(d);
  }
  c.querySelector('.ring').style.cssText='left:'+(-R-20)+'px;top:'+(-R-20)+'px;width:'+(2*R+40)+'px;height:'+(2*R+40)+'px';
}
function wheelShow(){
  const n=P.powers.length,w=$('pwWheel'),sl=w.querySelectorAll('.sl');
  sl.forEach((d,i)=>d.classList.toggle('sel',i===WHEEL.sel));
  const pw=POWERS[P.powers[WHEEL.sel]];if(pw){$('pwwN').textContent=pw.name;$('pwwT').textContent=pw.txt;}
}
function wheelOpen(src,slot){
  if(WHEEL.on||P.powers.length<4||G.state!=='play')return false;
  WHEEL.on=true;WHEEL.src=src;WHEEL.slot=slot;WHEEL.moved=false;
  const cur=P.powers.indexOf(P.slots[slot]);WHEEL.sel=cur<0?0:cur;
  WHEEL.cx=window.innerWidth/2;WHEEL.cy=window.innerHeight/2;
  wheelBuild();$('pwWheel').classList.add('on');wheelShow();
  try{if(navigator.vibrate)navigator.vibrate(15);}catch(e){}
  return true;
}
function wheelMove(x,y){
  if(!WHEEL.on)return;
  const dx=x-WHEEL.cx,dy=y-WHEEL.cy;if(Math.hypot(dx,dy)<28)return;
  WHEEL.moved=true;
  const n=P.powers.length;let a=Math.atan2(dy,dx)+Math.PI/2;a=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  const i=Math.round(a/(Math.PI*2)*n)%n;
  if(i!==WHEEL.sel){WHEEL.sel=i;wheelShow();try{if(navigator.vibrate)navigator.vibrate(6);}catch(e){}}
}
function wheelClose(apply){
  if(!WHEEL.on)return;
  WHEEL.on=false;$('pwWheel').classList.remove('on');
  if(apply){
    const id=P.powers[WHEEL.sel],s=WHEEL.slot;
    if(id){const j=P.slots.indexOf(id);if(j>=0&&j!==s)P.slots[j]=P.slots[s];P.slots[s]=id;pwKey='';}
  }
}
window.addEventListener('pointermove',e=>wheelMove(e.clientX,e.clientY));
/* trois raccourcis : appui = utiliser · maintenir = choisir le pouvoir du raccourci (si plus de 3 pouvoirs) */
const SLOTS=[0,1,2].map(slot=>{
  let tm=0,opened=false;
  return {
    start(src){
      opened=false;
      if(P.powers.length<4){IN.powSlot=slot;IN.powBuf=.25;return;}
      clearTimeout(tm);tm=setTimeout(()=>{tm=0;opened=wheelOpen(src,slot);},260);
    },
    end(src,cancel){
      if(P.powers.length<4)return;
      if(tm){clearTimeout(tm);tm=0;if(!opened&&!cancel){IN.powSlot=slot;IN.powBuf=.25;}}
      if(WHEEL.on&&WHEEL.src===src&&WHEEL.slot===slot){wheelClose(!cancel);opened=false;}
    }
  };
});
SLOTS.forEach((S,i)=>{
  const b=$('btnPw'+i),src='b'+i;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');try{b.setPointerCapture(e.pointerId);}catch(_){}S.start(src);});
  const up=e=>{b.classList.remove('down');S.end(src,e&&e.type==='pointercancel');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
});
const SLOTKEY={KeyE:0,Digit1:0,Numpad1:0,Digit2:1,Numpad2:1,Digit3:2,Numpad3:2};
document.addEventListener('contextmenu',e=>e.preventDefault());

function readInput(){
  let x=stick.x,z=stick.z;
  const kx=(keys.r?1:0)-(keys.l?1:0),kz=(keys.d?1:0)-(keys.u?1:0);
  if(kx||kz){const m=Math.hypot(kx,kz);x=kx/m;z=kz/m;}
  IN.ix=x;IN.iz=z;
}

/* ============ caméra ============ */
const cam={x:8,z:30};
function updateCamera(dt,title){
  let tx=P.x,tz=P.z,dist=1;
  if(boss&&!boss.dead&&boss.state!=='sleep'){tx=(P.x*2+boss.x)/3;tz=(P.z*2+boss.z)/3;dist=1.22;}
  if(camera.aspect<1)dist*=1.45;
  if(title){
    const a=timeT*.12;
    camera.position.set(L.start.cx+Math.sin(a)*6,5.2,L.start.cz+Math.cos(a)*6+2);
    camera.lookAt(L.start.cx,1.2,L.start.cz-1.5);return;
  }
  const k=Math.min(1,dt*5);cam.x+=(tx-cam.x)*k;cam.z+=(tz-cam.z)*k;
  const s=FX.shake*.32;
  camera.position.set(cam.x+(Math.random()-.5)*s,9.4*dist+(Math.random()-.5)*s*.5,cam.z+7.4*dist+(Math.random()-.5)*s);
  camera.lookAt(cam.x,.6,cam.z-.4);
}

/* ============ boucle principale ============ */
let last=performance.now(),qAcc=0,qN=0,qCool=2;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(now-last)/1000);last=now;if(dt<=0)return;
  const real=dt;
  if(homeOn){homeTick(real);return;}
  if(G.state==='pause'){render();return;}
  timeT+=dt;
  /* qualité adaptative */
  qAcc+=real;qN++;
  if(qAcc>1.5){
    const avg=qAcc/qN;qCool-=qAcc;
    if(qCool<=0){
      if(RES[resMode].px){qCool=3;}else if(avg>.026&&quality>.55){quality=Math.max(.55,quality*.85);resize();qCool=1.5;}
      else if(avg<.0185&&quality<qMax-.01){quality=Math.min(qMax,quality*1.1);resize();qCool=4;}
    }
    qAcc=0;qN=0;
  }
  if(G.state==='title'){
    SU.uTime.value=timeT;updateLights(dt);FX.fade=1;
    poseHero(dt,0);heroCloth(dt);
    emitAmbient(dt);updateParticles(dt);updateCamera(dt,true);render();return;
  }
  if(WHEEL.on&&(G.state!=='play'||P.dead))wheelClose(false);
  let gd=dt*FX.slow*(WHEEL.on?.12:1);
  if(FX.hitstop>0){FX.hitstop-=real;gd=0;}
  if(gd>0){
    readInput();
    if(G.state==='play'){G.time+=gd;}
    updatePlayer(gd);heroCloth(gd);updateEnemies(gd);updateShots(gd);updateHazards(gd);updatePowers(gd);updateWorldItems(gd);
    FX.shake=Math.max(0,FX.shake-gd*2.2);FX.hurt=Math.max(0,FX.hurt-gd*2.4);
    if(P.dead&&G.state==='play'){G.deadT-=real;FX.fade=Math.max(.3,FX.fade-real*.5);if(G.deadT<=0){G.state='dead';FX.slow=1;deathScreen();}}
    if(G.bossDead&&boss&&boss.dead&&G.state==='play'){
      G.winT-=real;if(G.winT<=0){G.state='won';winScreen();}
    }
    /* salle & musique */
    const rn=roomNameAt(P.x,P.z);
    if(rn!==G.room){G.room=rn;$('roomN').textContent='Étage '+G.level+' · '+rn;}
    updateMini(gd);
    let t=0,bossOn=false;
    for(const e of enemies){
      if(e.dead)continue;
      if(e.kind==='boss'){if(e.state!=='sleep'&&e.state!=='dying'){t=1;bossOn=true;}}
      else if(e.state!=='idle'&&t<.62)t=.62;
    }
    if(G.bossDead||P.dead)t=0;
    Snd.target=t;Snd.boss=bossOn;
    updateLights(gd);
  }
  FX.fade=Math.min(1,FX.fade+real*(P.dead?0:.8));
  emitAmbient(dt);updateParticles(gd||dt*.1);
  /* éléments animés du décor */
  for(const f of flames){
    if(f.userData.halo){f.quaternion.copy(camera.quaternion);f.material.uniforms.uA.value=.55+.25*Math.sin(timeT*6+f.id);}
    else{f.rotation.y=Math.atan2(camera.position.x-f.position.x,camera.position.z-f.position.z);}
  }
  hudAnim(real);Snd.tick();updateCamera(real,false);
  Snd.listen(camera.position.x,camera.position.y,camera.position.z);
  /* l'auditeur regarde vers -Z comme la caméra : stéréo cohérente avec l'écran */
  render();
}
let ambT=0;
function emitAmbient(dt){
  ambT-=dt;
  if(ambT<=0&&torches.length){
    ambT=.05;
    let best=null,bd=1e9;
    for(const t of torches){const d=(t.x-cam.x)*(t.x-cam.x)+(t.z-cam.z)*(t.z-cam.z);if(d<bd){bd=d;best=t;}}
    if(best&&bd<150)emit(best.x,best.y+.2,best.z,1,CUR.em,.5,.9,.05,-1.5,2.2);
  }
  if(G.state!=='pause')Snd.ambient(dt,P.x,P.z);
}
function render(){
  SU.uTime.value=timeT;SU.uCam.value.copy(camera.position);
  mUni.uC.value.set(P.x,0,P.z);
  postMat.uniforms.uTime.value=timeT;postMat.uniforms.uHurt.value=FX.hurt;postMat.uniforms.uFade.value=FX.fade;
  renderer.setRenderTarget(rt);renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.render(postScene,postCam);
}

/* ============ démarrage ============ */
resetRun(newSeed(),1);
G.state='title';
titleScreen();
requestAnimationFrame(frame);
window.__game={startNewRun,loadRun,readSaves,savesScreen,nextFloor,RUN,G,P,enemies:()=>enemies,boss:()=>boss,IN,FX,startGame,teleport:(x,z)=>{P.x=x;P.z=z;}};
})();
</script>
<script>
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
