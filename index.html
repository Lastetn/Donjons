<style>
/* Plein écran de jeu : canvas WebGL plein cadre, interface en surimpression, commandes tactiles dans les coins du pouce. */
:root{
  --bg:#06080b; --fg:#ece5d6; --dim:#a79f8e; --ember:#ff8a3d; --ember-2:#ffb066;
  --blood:#d23b2f; --bone:#ddd3bb; --glass:rgba(12,14,18,.58); --line:rgba(236,229,214,.18);
  --f-display:'Cinzel',Georgia,'Times New Roman',serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
button{font:inherit;color:inherit;touch-action:none}
button:focus-visible{outline:2px solid var(--ember-2);outline-offset:3px}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hl{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
#hpwrap{transition:width .6s cubic-bezier(.2,.8,.2,1);width:min(46vw,340px);height:14px;padding:3px;background:rgba(6,6,8,.82);border:1px solid rgba(214,190,140,.6);box-shadow:0 0 0 1px rgba(0,0,0,.85),0 3px 12px rgba(0,0,0,.65)}
.hpin{position:relative;height:100%;background:rgba(255,255,255,.05)}
.hpin i{position:absolute;left:0;top:0;bottom:0;width:100%}
#hpwrap .hpin::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/var(--n,6) - 1px),rgba(0,0,0,.6) calc(100%/var(--n,6) - 1px),rgba(0,0,0,.6) calc(100%/var(--n,6)))}
#hpTrail,#bossTrail{background:#d9a02e}
#hpFill{background:linear-gradient(180deg,#e0554a,#b3281f 55%,#7d1812);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
#sub{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone);text-shadow:0 1px 6px #000}
#keyI{display:inline-flex;color:var(--ember-2);filter:drop-shadow(0 0 6px rgba(255,150,60,.8))}
#hr{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));display:flex;gap:8px}
.ib{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;font-weight:600;letter-spacing:.05em}
.ib svg{width:20px;height:20px;fill:currentColor}
#mm{pointer-events:auto;cursor:pointer;position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(max(12px,env(safe-area-inset-top,0px)) + 52px);width:132px;height:108px;border:1px solid rgba(214,190,140,.45);background:rgba(6,8,11,.5);image-rendering:pixelated;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(22px,calc(env(safe-area-inset-bottom,0px) + 10px));width:min(400px,38vw)}
#bossName{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone);margin-bottom:5px;text-shadow:0 1px 8px #000}
.trk{height:14px;padding:3px;background:rgba(6,6,8,.82);border:1px solid rgba(214,190,140,.6);box-shadow:0 0 0 1px rgba(0,0,0,.85),0 3px 12px rgba(0,0,0,.65)}
#bossFill{background:linear-gradient(180deg,#e0554a,#b3281f 55%,#7d1812);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}

#banner{position:fixed;left:0;right:0;top:20%;text-align:center;pointer-events:none;z-index:6;opacity:0;transition:opacity .5s}
#banner.on{opacity:1}
#banner b{display:block;font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5.4vw,44px);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 2px 18px rgba(0,0,0,.9),0 0 30px rgba(255,120,40,.35)}
#banner span{display:block;margin-top:8px;font-size:clamp(12px,2.6vw,16px);color:var(--dim);letter-spacing:.06em;text-shadow:0 1px 8px #000}

#stickZone{position:fixed;left:0;bottom:0;width:52%;height:70%;z-index:4;touch-action:none}
#stickBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,rgba(255,255,255,.05),rgba(255,255,255,.015));opacity:0;transition:opacity .15s}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(236,229,214,.22);border:1px solid rgba(236,229,214,.5)}
#btns{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 12px));bottom:max(26px,calc(env(safe-area-inset-bottom,0px) + 16px));z-index:6;display:flex;align-items:flex-end;gap:16px}
.act{width:68px;height:68px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--bone);font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.act.big{width:96px;height:96px;font-size:13px;border-color:rgba(255,138,61,.6);background:radial-gradient(circle at 50% 35%,rgba(255,138,61,.35),rgba(120,40,10,.45));color:#fff1dc;box-shadow:0 0 24px rgba(255,110,30,.25)}

#bigmap{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(4,5,8,.84);padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));box-sizing:border-box}
#bigmap[hidden]{display:none}
.bm-card{border:1px solid rgba(214,190,140,.45);background:rgba(10,12,17,.96);padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 6px 30px rgba(0,0,0,.6)}
.bm-h{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;color:var(--bone);font-family:var(--f-display);letter-spacing:.14em;text-transform:uppercase;font-size:12px}
#bmc{image-rendering:pixelated;max-width:100%}
.bm-l{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;color:var(--bone);font-size:11px;opacity:.85}
.bm-l i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
#pwWheel{position:fixed;inset:0;z-index:7;display:none;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.15),rgba(0,0,0,.62) 70%)}
#pwWheel.on{display:block}
#pwWheel .wc{position:absolute;left:50%;top:50%;width:0;height:0}
#pwWheel .ring{position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
#pwWheel .sl{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:rgba(14,12,12,.82);border:2px solid var(--c,#fff);opacity:.6;transition:transform .08s,opacity .08s,box-shadow .08s}
#pwWheel .sl.sel{transform:scale(1.3);opacity:1;box-shadow:0 0 26px var(--c,#fff)}
#pwWheel .sl.cd::after{content:'';position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.55)}
#pwWheel .mid{position:absolute;left:-95px;top:-34px;width:190px;text-align:center;color:var(--bone,#eee);line-height:1.25}
#pwWheel .mid b{display:block;font-size:17px}#pwWheel .mid span{font-size:12px;opacity:.75}
#pwWrap{display:flex;flex-direction:column-reverse;align-items:center;gap:9px;margin-bottom:2px}
.act.pw.sm{width:52px;height:52px;font-size:22px;position:relative;touch-action:none}
.act.pw.sm.empty{opacity:.4;font-size:20px;box-shadow:none;border-style:dashed}
.act.pw.sm::after{content:attr(data-k);position:absolute;right:-3px;top:-3px;font-family:var(--f-display);font-size:9px;letter-spacing:0;line-height:1;background:rgba(0,0,0,.7);border:1px solid var(--line);border-radius:7px;padding:2px 4px;color:var(--bone)}
#pwWheel .sl[data-s]::before{content:attr(data-s);position:absolute;top:-6px;right:-4px;z-index:1;font-size:11px;font-weight:700;font-family:sans-serif;background:var(--c,#fff);color:#000;border-radius:8px;padding:0 5px;line-height:15px}
.pwcol{display:flex;flex-direction:column;align-items:center;gap:3px}
#pwName{font-family:var(--f-display);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone);text-shadow:0 1px 6px #000;max-width:92px;text-align:center}
.act.pw{font-size:28px;letter-spacing:0;border-color:var(--pc,#fff);box-shadow:0 0 18px var(--pc,#fff);padding:0}
.mini{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--bone);font-size:16px;cursor:pointer;margin-bottom:22px}
.act:active,.act.down{transform:scale(.94);filter:brightness(1.3)}

#screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;
  background:radial-gradient(ellipse at 50% 38%,rgba(70,28,10,.55),rgba(6,8,11,.94) 62%),#06080b;overflow:auto;touch-action:pan-y}
#screen[hidden]{display:none}
.card{width:min(520px,100%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.card h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(34px,9vw,64px);line-height:1.02;letter-spacing:.1em;text-transform:uppercase;text-wrap:balance;
  background:linear-gradient(180deg,#fff0d6 10%,#ff9a4a 60%,#8e2f12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 14px rgba(255,100,20,.35))}
.card .tag{margin:0;color:var(--dim);font-size:15px;letter-spacing:.04em;max-width:34ch;text-wrap:balance}
.go{pointer-events:auto;margin-top:6px;padding:15px 30px;border-radius:2px;border:1px solid var(--ember);background:linear-gradient(180deg,rgba(255,138,61,.22),rgba(150,50,12,.35));color:#fff1dc;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;box-shadow:0 0 28px rgba(255,110,30,.28)}
.go:hover{filter:brightness(1.15)}
.ghost{background:none;border:1px solid var(--line);box-shadow:none;color:var(--bone)}
.how{display:grid;grid-template-columns:1fr;gap:8px;width:100%;margin:2px 0 0;padding:0;list-style:none;text-align:left;font-size:13.5px;line-height:1.45;color:var(--dim)}
.how li{display:flex;gap:12px;align-items:baseline;border-top:1px solid var(--line);padding-top:8px}
.how b{flex:none;min-width:84px;font-family:var(--f-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone);font-weight:500}
.small{font-size:12px;color:var(--dim);letter-spacing:.03em;margin:0}
.svl{width:100%;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:8px;text-align:left}
.sv{display:flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 10px;background:var(--glass)}
.svi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.svi b{font-family:var(--f-display);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--bone)}.svi span{font-size:12px;color:var(--dim)}
.go.sm{margin:0;padding:9px 12px;font-size:11px;letter-spacing:.12em}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#fatal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:var(--bg);text-align:center;color:var(--bone);line-height:1.5}
#fatal[hidden]{display:none}

#screen.home{padding:0;overflow:hidden;background:#0c0716;touch-action:none}
.hm{position:absolute;inset:0;overflow:hidden}
#hmC{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hmv{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(4,2,8,.72) 100%),linear-gradient(180deg,rgba(4,2,8,.35),transparent 30%,transparent 62%,rgba(4,2,8,.35))}
.hmc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 21vh max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:auto}
.hmt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-top:2vh}
.hmlogo{width:clamp(48px,12vh,92px);height:auto;filter:drop-shadow(0 0 14px rgba(255,120,30,.6));animation:hmf 3.2s ease-in-out infinite}
@keyframes hmf{50%{filter:drop-shadow(0 0 26px rgba(255,150,40,.95));transform:translateY(-2px)}}
.hmt h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,8.5vh,64px);line-height:1;letter-spacing:.12em;text-transform:uppercase;text-wrap:balance;
  background:linear-gradient(180deg,#fff4dc 8%,#ffb060 48%,#c4401a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a0a06) drop-shadow(0 0 18px rgba(255,100,20,.45))}
.hms{margin:2px 0 0;font-family:var(--f-display);font-size:clamp(11px,2.4vh,15px);letter-spacing:.22em;text-transform:uppercase;color:#e6c8a0;text-shadow:0 1px 6px #000}
.hmb{display:flex;flex-direction:column;align-items:stretch;gap:9px;width:min(400px,100%)}
.hmgo{margin:0;font-size:13px;letter-spacing:.12em;text-align:center;display:flex;flex-direction:column;gap:3px;align-items:center;padding:clamp(9px,2.6vh,15px) 18px;background:linear-gradient(180deg,rgba(255,138,61,.3),rgba(150,50,12,.5));backdrop-filter:blur(2px)}
.hmgo.ghost{background:rgba(12,8,18,.62);border:1px solid rgba(255,176,102,.4)}
.hmgo i{font-style:normal;font-family:var(--f-body);font-size:11px;letter-spacing:.04em;text-transform:none;color:#cdbfa8;font-weight:400}
.hmgo:disabled{opacity:.38;cursor:default;filter:none}
.hmr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.hmr .go{background:rgba(12,8,18,.62)}
@media (max-height:460px){.hmlogo{display:none}.hmc{flex-direction:row;align-items:center;justify-content:space-around;padding-bottom:20vh}.hmb{width:min(320px,46%);gap:6px}.hmt{margin:0;flex:1}.hmgo i{display:none}.hmgo{padding:8px 12px}.hms{display:none}}
@media (prefers-reduced-motion:reduce){.hmlogo{animation:none}}
@media (max-height:460px){.card{gap:10px}.card h1{font-size:30px}.how{display:none}}
@media (prefers-reduced-motion:reduce){#banner{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
/* ============ utilitaires ============ */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

if(typeof THREE==='undefined'){$('fatal').hidden=false;$('screen').hidden=true;return;}

/* ============ rendu ============ */
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:false,powerPreference:'high-performance'});}
catch(err){$('fatal').hidden=false;$('screen').hidden=true;return;}
renderer.setClearColor(0x000000,1);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(46,1,0.1,90);
const rt=new THREE.WebGLRenderTarget(4,4,{minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,depthBuffer:true,stencilBuffer:false});
const postScene=new THREE.Scene();
const postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

const POST_FS=`
uniform sampler2D tD; uniform vec2 uRes; uniform float uTime; uniform float uHurt; uniform float uFade; uniform float uPix; uniform vec3 uTint;
varying vec2 vUv;
float h21(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){
  vec2 uv=vUv; vec2 c=uv-.5; float r2=dot(c,c);

const NL=10;
const LP=[],LC=[];

const SU={
  uTime:{value:0},uL:{value:LP},uLC:{value:LC},
  uCam:{value:new THREE.Vector3()},uAmb:{value:new THREE.Vector3(.04,.045,.065)},
  uWallA:{value:new THREE.Vector3(.30,.29,.28)},uWallB:{value:new THREE.Vector3(.42,.38,.33)},
  uFloorA:{value:new THREE.Vector3(.22,.21,.21)},uFloorB:{value:new THREE.Vector3(.34,.32,.30)},

const NOISE=`
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*noise(p);p=p*2.03+17.1;a*=.5;}return s;}
`;

const LIT_VS=`varying vec3 vW; varying vec3 vN;
void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*viewMatrix*w;}`;

/* types : 0 mur · 1 sol · 3 porte · 4 générique · 5 roche de braise · 6 émissif · 7 gelée */
const LIT_FS=`
#define NL ${NL}
uniform float uTime; uniform vec4 uL[NL]; uniform vec3 uLC[NL]; uniform vec3 uCam; uniform vec3 uAmb;
uniform vec3 uWallA; uniform vec3 uWallB; uniform vec3 uFloorA; uniform vec3 uFloorB; uniform vec3 uAcc; uniform float uPat; uniform vec4 uFog;
uniform float uType; uniform vec3 uColor; uniform float uFlash; uniform float uWarn;
varying vec3 vW; varying vec3 vN;
${NOISE}
vec3 perturb(vec3 N,vec3 p,float h){
  vec3 dpx=dFdx(p),dpy=dFdy(p); float dhx=dFdx(h),dhy=dFdy(h);
  vec3 r1=cross(dpy,N),r2=cross(N,dpx); float det=dot(dpx,r1);
  vec3 grad=sign(det)*(dhx*r1+dhy*r2);
  return normalize(abs(det)*N-grad);

vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
  vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;

  vec3 alb=uColor; vec3 emc=vec3(0.); float h=0.; float bump=0.; float spec=.12; float shin=18.;
  float t=uType;
  if(t<.5){
    vec2 uv=vec2(abs(N.x)>.5?vW.z:vW.x,vW.y);
    vec2 b=uv*vec2(.9,2.0); float row=floor(b.y); b.x+=mod(row,2.)*.5+hash(vec2(row,3.))*3.;
    vec2 cell=floor(b); vec2 f=fract(b);
    float ex=min(f.x,1.-f.x),ey=min(f.y,1.-f.y);
    float m=smoothstep(.015,.085,min(ex*.9,ey*1.6));
    float rn=hash(cell); float n1=fbm(uv*5.+cell*7.3);

    }else if(uPat<2.5){

      float lv=(1.-m)*(.55+.6*fbm(uv*6.+uTime*.12));
      emc=uAcc*lv*(1.1+.5*sin(uTime*2.5+uv.x*3.)); h=m*(.5+.4*n1); spec=.3; shin=30.; bump=.09;
    }else if(uPat<4.5){

      base=mix(uWallA,uWallB,rn*.6+n1*.4)*(.8+.3*n1); base=mix(base,vec3(1.),cr*.3); base*=mix(.75,1.,m);

    }else if(uPat<5.5){

      base=mix(uWallA,uWallB,rn*.5+n1*.5)*(.7+.5*n1)*(.8+.4*st); base*=mix(.6,1.,m);
      float gl=smoothstep(.6,.66,fbm(uv*vec2(5.,9.)+cell))*step(.72,rn);
      emc=uAcc*gl*.5*(.6+.4*sin(uTime*1.2+uv.x)); h=m*.6+st*.3; spec=.04; shin=10.; bump=.08;
    }else if(uPat<6.5){

      base=mix(base,uAcc*(.5+n1),sl*.6); base*=mix(.4,1.,m); h=m*.5+n1*.3; spec=.15+.5*sl; shin=30.; bump=.08;

    }else if(uPat<7.5){

      emc=uAcc*.18*step(.93,rn)*(.5+.5*sin(uTime*3.+rn*20.)); h=pl*.6+rv*.4; spec=.8; shin=45.; bump=.05;
    }else if(uPat<8.5){

    }

  }else if(t<1.5){
    vec2 uv=vW.xz; vec2 g=uv*.5; vec2 cell=floor(g); vec2 f=fract(g);

    float rn=hash(cell); float n1=fbm(uv*2.2+rn*10.);

    if(uPat<.5){

      vec3 base=mix(vec3(.22,.21,.21),vec3(.34,.32,.30),rn)*(.6+.8*n1);
      base*=mix(.3,1.,m)*(1.-crack*.7);

    }else if(uPat<2.5){
      float c1=fbm(uv*2.6+uTime*.25),c2=fbm(uv*2.6-uTime*.21+5.);
      float caus=smoothstep(.09,.0,abs(c1-c2));
      alb=mix(uFloorA,uFloorB,n1)*(.65+.6*fbm(uv*9.))*mix(.6,1.,m); h=fbm(uv*14.)*.5; bump=.05;
      spec=.35+wet*.6; shin=40.; emc=uAcc*caus*.55;
    }else if(uPat<3.5){
      alb=mix(uFloorA,uFloorB,rn)*(.5+.8*n1)*mix(.3,1.,m); h=m*.5+n1*.3; bump=.06;
      float lc=1.-smoothstep(0.,.05,abs(fbm(uv*.9+cell*1.7+uTime*.01)-.5));
      emc=uAcc*(lc+(1.-m)*.7)*(.9+.45*sin(uTime*2.2+uv.x*2.)); spec=.3; shin=25.;
    }else if(uPat<4.5){
      alb=mix(uFloorA,uFloorB,n1)*(.8+.3*rn)*mix(.8,1.,m); alb=mix(alb,vec3(1.),crack*.35);
      h=n1*.2-crack*.2; bump=.03; spec=1.25; shin=130.;
    }else if(uPat<5.5){

      emc=uAcc*(1.-pl)*(.5+.3*sin(uTime*2.+uv.x*2.))*.8; h=pl*.5; spec=.8; shin=40.; bump=.05;

    vec2 uv=vec2(abs(N.x)>.5?vW.z:vW.x,vW.y);

function lit(type,color){

const FLAME_FS=`
uniform float uSeed; uniform float uInt; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3;
void main(){
  vec2 p=vec2((vUv.x-.5)*2.,vUv.y);
  float n=fbm(vec2(p.x*2.2,p.y*2.4-uTime*2.4+uSeed));
  float w=mix(.8,.06,pow(vUv.y,.75));
  float d=abs(p.x+(n-.5)*.5*vUv.y)/w;
  float s=1.-smoothstep(.45,1.,d+(n-.5)*.35);
  s*=smoothstep(0.,.1,vUv.y)*smoothstep(1.,.55,vUv.y+(n-.5)*.3);
  vec3 c=mix(uC1,uC2,s*s);
  c=mix(c,uC3,pow(s,4.)*.9*(1.-vUv.y));
  gl_FragColor=vec4(c*uInt,clamp(s,0.,1.));
}`;
const RING_FS=`
uniform vec3 uCol; uniform float uA;
void main(){
  float r=length(vUv-.5)*2.;

const TELE_FS=`
uniform vec3 uCol; uniform float uA; uniform float uProg;
void main(){

  float a=(fill+rim+edge)*uA*(.8+.2*sin(uTime*22.));

const STRIP_FS=`
uniform vec3 uCol; uniform float uA;
void main(){

const SLASH_FS=`
uniform vec3 uCol; uniform float uA; uniform float uProg; uniform float uDir;
void main(){

const gcache={};
function gk(key,fn){return gcache[key]||(gcache[key]=fn());}
const bx=(w,h,d)=>gk('b'+w+'|'+h+'|'+d,()=>new THREE.BoxGeometry(w,h,d));
const sp=(r,ws,hs)=>gk('s'+r+'|'+(ws||14)+'|'+(hs||10),()=>new THREE.SphereGeometry(r,ws||14,hs||10));
const cy=(rt_,rb,h,s)=>gk('c'+rt_+'|'+rb+'|'+h+'|'+(s||10),()=>new THREE.CylinderGeometry(rt_,rb,h,s||10));
const co=(r,h,s)=>gk('o'+r+'|'+h+'|'+(s||8),()=>new THREE.ConeGeometry(r,h,s||8));

function part(parent,geo,type,color,x,y,z){

}
function setFlash(root,v){root.traverse(o=>{if(o.material&&o.material.uniforms&&o.material.uniforms.uFlash)o.material.uniforms.uFlash.value=v;});}
function setWarn(root,v){root.traverse(o=>{if(o.material&&o.material.uniforms&&o.material.uniforms.uWarn)o.material.uniforms.uWarn.value=v;});}

/* ============ particules (étincelles) ============ */
const NP=300;
const pPos=new Float32Array(NP*3),pCol=new Float32Array(NP*3),pSize=new Float32Array(NP);
const pVel=new Float32Array(NP*3),pLife=new Float32Array(NP),pMax=new Float32Array(NP),pGrav=new Float32Array(NP),pS0=new Float32Array(NP);
let pHead=0;
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('aCol',new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('aSize',new THREE.BufferAttribute(pSize,1));
const pUni={uScale:{value:400}};
const pMat=new THREE.ShaderMaterial({
  uniforms:pUni,
  vertexShader:'attribute vec3 aCol; attribute float aSize; uniform float uScale; varying vec3 vC; void main(){vC=aCol;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*uScale/max(.5,-mv.z);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'varying vec3 vC; void main(){float r=length(gl_PointCoord-.5)*2.;float a=1.-smoothstep(.2,1.,r);if(a<.01)discard;gl_FragColor=vec4(vC*1.4,a);}',
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});

const tmpC=new THREE.Color();
function emit(x,y,z,n,color,speed,life,size,grav,up){
  tmpC.set(color);
  for(let k=0;k<n;k++){
    const i=pHead;pHead=(pHead+1)%NP;
    const a=Math.random()*TAU,s=speed*(.3+Math.random()*.7),el=(Math.random()*.9-.2);
    pPos[i*3]=x;pPos[i*3+1]=y;pPos[i*3+2]=z;
    pVel[i*3]=Math.cos(a)*s;pVel[i*3+1]=(up==null?.6:up)*s*(.4+Math.random())+el;pVel[i*3+2]=Math.sin(a)*s;
    pLife[i]=pMax[i]=life*(.6+Math.random()*.6);pGrav[i]=grav==null?9:grav;pS0[i]=size*(.6+Math.random()*.8);
    pCol[i*3]=tmpC.r;pCol[i*3+1]=tmpC.g;pCol[i*3+2]=tmpC.b;
  }
}
function updateParticles(dt){
  for(let i=0;i<NP;i++){
    if(pLife[i]<=0){pSize[i]=0;continue;}
    pLife[i]-=dt;
    if(pLife[i]<=0){pSize[i]=0;continue;}
    pVel[i*3+1]-=pGrav[i]*dt;
    pPos[i*3]+=pVel[i*3]*dt;pPos[i*3+1]+=pVel[i*3+1]*dt;pPos[i*3+2]+=pVel[i*3+2]*dt;
    if(pPos[i*3+1]<.04){pPos[i*3+1]=.04;pVel[i*3+1]*=-.35;pVel[i*3]*=.7;pVel[i*3+2]*=.7;}
    pSize[i]=pS0[i]*Math.min(1,pLife[i]/pMax[i]*1.6);
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.aSize.needsUpdate=true;pGeo.attributes.aCol.needsUpdate=true;
}

const mUni={uC:{value:new THREE.Vector3()},uTime:SU.uTime,uScale:pUni.uScale,uCol:{value:new THREE.Vector3(1,.82,.6)},uDrift:{value:.07},uSize:{value:1},uPulse:{value:0}};

  void main(){

function resize(){
  const w=Math.max(1,window.innerWidth),h=Math.max(1,window.innerHeight),m=RES[resMode];
  let pw,ph;

/* ============ audio : tout est synthétisé en direct, spatialisé en HRTF (stéréo casque) ============ */
const Snd={ctx:null,on:true,voices:0,intensity:0,target:0,boss:false,nextStep:0,step:0,timer:0,dripT:3,crackT:0};
let STEP=60/76/4;
let ROOTS=[73.42,58.27,49.0,55.0];           /* Ré, Si♭, Sol, La */
let TRIAD=[[1,1.189,1.498],[1,1.26,1.498],[1,1.189,1.498],[1,1.26,1.498]];

Snd.init=function(){
  if(this.ctx)return;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{this.ctx=new AC({latencyHint:'balanced'});}catch(e){this.ctx=null;return;}
  const c=this.ctx;
  this.master=c.createGain();this.master.gain.value=1.15;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-6;comp.ratio.value=3;comp.attack.value=.01;comp.release.value=.35;
  this.master.connect(comp);comp.connect(c.destination);
  /* réverbération de pierre : réponse impulsionnelle stéréo générée */
  this.verb=c.createConvolver();this.verb.buffer=this.makeIR(2.0,2.4);
  this.send=c.createGain();this.send.gain.value=.5;this.send.connect(this.verb);
  const vg=c.createGain();vg.gain.value=.85;this.verb.connect(vg);vg.connect(this.master);
  this.sfx=c.createGain();this.sfx.gain.value=1;this.sfx.connect(this.master);
  const sg=c.createGain();sg.gain.value=.5;this.sfx.connect(sg);sg.connect(this.send);
  this.mus=c.createGain();this.mus.gain.value=.62;this.mus.connect(this.master);
  const mg=c.createGain();mg.gain.value=.35;this.mus.connect(mg);mg.connect(this.send);
  /* bruit blanc 4 s */
  const n=c.sampleRate*4,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  this.nbuf=b;
  const L=c.listener;
  if(L.forwardX){L.forwardX.value=0;L.forwardY.value=0;L.forwardZ.value=-1;L.upX.value=0;L.upY.value=1;L.upZ.value=0;}
  else if(L.setOrientation)L.setOrientation(0,0,-1,0,1,0);
  this.startBeds();
  this.nextStep=c.currentTime+.15;
  this.timer=setInterval(()=>this.tick(),50);
};
Snd.makeIR=function(sec,decay){
  const c=this.ctx,len=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=b.getChannelData(ch);let lp=0;
    for(let i=0;i<len;i++){
      const t=i/len,nz=Math.random()*2-1;
      lp+=(nz-lp)*(.9-.78*t);
      d[i]=lp*Math.pow(1-t,decay)*(i<200?i/200:1);
    }
  }
  return b;
};
Snd.resume=function(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();};
Snd.suspend=function(){if(this.ctx&&this.ctx.state==='running')this.ctx.suspend();};
Snd.setOn=function(v){this.on=v;if(this.master)this.master.gain.setTargetAtTime(v?1.15:0,this.ctx.currentTime,.05);};
Snd.listen=function(x,y,z){
  if(!this.ctx)return;const L=this.ctx.listener;
  if(L.positionX){L.positionX.value=x;L.positionY.value=y;L.positionZ.value=z;}
  else if(L.setPosition)L.setPosition(x,y,z);
};

/* routage : source -> gain -> (panneur HRTF) -> bus */
Snd.route=function(x,z,y){
  const c=this.ctx,g=c.createGain();
  if(x!=null&&this.voices<16){
    const p=c.createPanner();p.panningModel='HRTF';p.distanceModel='inverse';p.refDistance=2.6;p.maxDistance=70;p.rolloffFactor=1.15;
    const py=y==null?1:y;
    if(p.positionX){p.positionX.value=x;p.positionY.value=py;p.positionZ.value=z;}else p.setPosition(x,py,z);
    g.connect(p);p.connect(this.sfx);this.voices++;
    return {in:g,end:()=>{this.voices--;try{p.disconnect();}catch(e){}}};
  }
  g.connect(this.sfx);return {in:g,end:()=>{}};
};
Snd.noise=function(x,z,o){
  if(!this.ctx||!this.on)return;
  const c=this.ctx,t=c.currentTime+(o.delay||0);
  const src=c.createBufferSource();src.buffer=this.nbuf;
  const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.Q.value=o.q||1;
  f.frequency.setValueAtTime(o.f0,t);if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+o.d);
  const g=c.createGain(),v=o.v==null?.3:o.v,a=o.a||.004;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  const r=this.route(x,z,o.y);src.connect(f);f.connect(g);g.connect(r.in);src.onended=r.end;
  src.start(t,Math.random()*1.8);src.stop(t+o.d+.05);
};
Snd.tone=function(x,z,o){
  if(!this.ctx||!this.on)return;
  const c=this.ctx,t=c.currentTime+(o.delay||0);
  const os=c.createOscillator();os.type=o.t||'sine';
  os.frequency.setValueAtTime(o.f0,t);if(o.f1)os.frequency.exponentialRampToValueAtTime(o.f1,t+o.d);
  const g=c.createGain(),v=o.v==null?.3:o.v,a=o.a||.006;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+o.d);
  let last=os;
  if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;os.connect(f);last=f;}
  const r=this.route(x,z,o.y);last.connect(g);g.connect(r.in);os.onended=r.end;
  os.start(t);os.stop(t+o.d+.05);
};

Snd.swing=function(x,z,k){this.noise(x,z,{d:.22,f0:500+k*120,f1:2600,q:.9,v:.32});this.tone(x,z,{t:'triangle',f0:260,f1:520,d:.12,v:.05});};

/* dégâts reçus : grondement grave et résonant, localisé du côté de l'ennemi (x,z = source du coup) */
Snd.hurt=function(x,z,n){
  if(!this.ctx||!this.on)return;
  /* tout est proportionnel aux dégâts (1 = coup léger, 2 = coup lourd), avec une très légère variation à chaque coup */
  const d=clamp(n||1,1,3)-1,pv=1+(Math.random()-.5)*.07,vv=1+(Math.random()-.5)*.1;
  const k=(1+.45*d)*2.9*vv,y=.8,c=this.ctx,t=c.currentTime;
  const F=f=>f*pv;
  this.mus.gain.cancelScheduledValues(t);this.mus.gain.setValueAtTime(this.mus.gain.value,t);
  this.mus.gain.linearRampToValueAtTime(Math.max(.1,.18-.08*d),t+.03);this.mus.gain.linearRampToValueAtTime(.62,t+1.8+1.4*d);
  this.tone(x,z,{f0:F(120),f1:F(45),d:.5,v:1.0*k,lp:420,a:.003,y:y});
  this.tone(x,z,{f0:F(78),f1:F(30),d:1.1,v:.9*k,lp:240,a:.004,y:y});
  this.tone(x,z,{f0:F(52),f1:F(24),d:1.6,v:.7*k,lp:160,a:.02,y:y,delay:.03});
  this.tone(x,z,{t:'sawtooth',f0:F(62),f1:F(34),d:1.4,v:.36*k,lp:300,a:.01,y:y});
  this.tone(x,z,{t:'sawtooth',f0:F(64.5),f1:F(35),d:1.4,v:.3*k,lp:300,a:.01,y:y});
  this.noise(x,z,{type:'lowpass',f0:F(420),f1:F(70),q:5,d:1.5,v:.7*k,a:.005,y:y});
  this.noise(x,z,{type:'bandpass',f0:F(380),f1:F(160),q:3,d:.28,v:.6*k,y:y});
  const L=3.5+1.15*(d+1),tv=(1+.2*d)*k;
  this.tone(null,0,{f0:F(46),f1:F(30),d:L,v:.8*tv,a:.012,delay:.02});
  this.tone(null,0,{f0:F(36),f1:F(27),d:L*.9,v:.7*tv,a:.02,delay:.04});
  this.tone(null,0,{f0:F(36.9),f1:F(27.6),d:L*.9,v:.5*tv,a:.02,delay:.04});
  this.tone(null,0,{f0:F(88),f1:F(56),d:L*.55,v:.4*tv,lp:220,a:.01,delay:.02});
  this.tone(null,0,{t:'sawtooth',f0:F(55),f1:F(40),d:L*.7,v:.2*tv,lp:180,a:.08,delay:.05});
  this.noise(null,0,{type:'lowpass',f0:F(170),f1:F(48),q:14,d:L,v:.45*tv,a:.12,delay:.05});
  this.noise(x,z,{type:'lowpass',f0:F(200),f1:F(60),q:9,d:2.4,v:.4*k,a:.05,y:y,delay:.08});
};

/* ---- nappes continues : bourdon + vent ---- */
Snd.startBeds=function(){

function solidAt(tx,tz){if(tx<0||tz<0||tx>=W||tz>=H)return true;return grid[tz*W+tx]!==1;}
function blocked(x,z,r){
  const x0=Math.floor(x-r),x1=Math.floor(x+r),z0=Math.floor(z-r),z1=Math.floor(z+r);
  for(let tz=z0;tz<=z1;tz++)for(let tx=x0;tx<=x1;tx++){
    if(!solidAt(tx,tz))continue;
    const nx=Math.max(tx,Math.min(x,tx+1)),nz=Math.max(tz,Math.min(z,tz+1));
    const dx=x-nx,dz=z-nz;if(dx*dx+dz*dz<r*r)return true;
  }
  return false;
}
function move(e,dx,dz,r){
  const ox=e.x,oz=e.z;
  if(!blocked(e.x+dx,e.z,r))e.x+=dx;
  if(!blocked(e.x,e.z+dz,r))e.z+=dz;
  return Math.abs(e.x-ox)+Math.abs(e.z-oz);
}
function los(x0,z0,x1,z1){
  const dx=x1-x0,dz=z1-z0,n=Math.ceil(Math.hypot(dx,dz)/.4);
  for(let i=1;i<n;i++){const t=i/n;if(solidAt(Math.floor(x0+dx*t),Math.floor(z0+dz*t)))return false;}
  return true;
}
function carve(x0,z0,x1,z1){for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++)grid[z*W+x]=1;}
function quad(Pa,Na,a,b,c,d,n){
  Pa.push(a[0],a[1],a[2],b[0],b[1],b[2],c[0],c[1],c[2],a[0],a[1],a[2],c[0],c[1],c[2],d[0],d[1],d[2]);
  for(let i=0;i<6;i++)Na.push(n[0],n[1],n[2]);
}

  g.setAttribute('normal',new THREE.Float32BufferAttribute(Na,3));

}

let RNG=Math.random;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const ROOM_NAMES=['La Salle des Braseros','Les Oubliettes','La Crypte oubliée','Le Réfectoire','La Nef brisée','Le Cloître','L’Ossuaire','La Salle des Gardes','La Forge éteinte','La Citerne','Le Scriptorium','La Galerie des Cendres'];

function generate(seed,level){
  RNG=mulberry(seed);

    }

  }
  function mark(x0,z0,x1,z1,m,val){for(let z=z0-m;z<=z1+m;z++)for(let x=x0-m;x<=x1+m;x++){if(x<0||z<0||x>=W||z>=H)continue;if(res[z*W+x]===0)res[z*W+x]=val;}}
  function fill(x0,z0,x1,z1,v){for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++)g[z*W+x]=v;}
  function mkRoom(x0,z0,w,h,type){
    const cxi=x0+((w/2)|0),czi=z0+((h/2)|0);
    return {id:rooms.length,type:type,name:'',x0:x0,z0:z0,x1:x0+w-1,z1:z0+h-1,w:w,h:h,cxi:cxi,czi:czi,cx:cxi+.5,cz:czi+.5,depth:0,parent:-1};

  function planCorridor(A,B,d){
    const rects=[];

      const sz=A.czi,ez=B.czi;let sx,ex,mx;
      if(d===0){sx=A.x1+1;ex=B.x0-1;mx=ri(sx+1,ex-3);}
      else{sx=A.x0-1;ex=B.x1+1;mx=ri(ex+3,sx-1);}
      const a=Math.min(sx,mx),b=Math.max(sx,mx),c=Math.min(mx,ex),e=Math.max(mx,ex);
      rects.push([a,sz-1,b,sz+1]);
      rects.push([mx-1,Math.min(sz,ez)-1,mx+1,Math.max(sz,ez)+1]);
      rects.push([c,ez-1,e,ez+1]);
      return {rects:rects,d:d,axis:'x',endCells:[[ex,ez-1],[ex,ez],[ex,ez+1]],endX:ex,endZ:ez};
    }
    const sx=A.cxi,ex=B.cxi;let sz,ez,mz;
    if(d===1){sz=A.z1+1;ez=B.z0-1;mz=ri(sz+1,ez-3);}
    else{sz=A.z0-1;ez=B.z1+1;mz=ri(ez+3,sz-1);}
    const a=Math.min(sz,mz),b=Math.max(sz,mz),c=Math.min(mz,ez),e=Math.max(mz,ez);
    rects.push([sx-1,a,sx+1,b]);
    rects.push([Math.min(sx,ex)-1,mz-1,Math.max(sx,ex)+1,mz+1]);
    rects.push([ex-1,c,ex+1,e]);
    return {rects:rects,d:d,axis:'z',endCells:[[ex-1,ez],[ex,ez],[ex+1,ez]],endX:ex,endZ:ez};
  }
  function attach(A,d,w,h,type){
    for(let tries=0;tries<10;tries++){
      const gap=ri(5,14);let x0,z0;
      if(d===0){x0=A.x1+1+gap;z0=A.czi-((h/2)|0)+ri(-4,4);}
      else if(d===2){x0=A.x0-gap-w;z0=A.czi-((h/2)|0)+ri(-4,4);}
      else if(d===1){z0=A.z1+1+gap;x0=A.cxi-((w/2)|0)+ri(-4,4);}
      else{z0=A.z0-gap-h;x0=A.cxi-((w/2)|0)+ri(-4,4);}
      const B=mkRoom(x0,z0,w,h,type);
      if(!chk(B.x0,B.z0,B.x1,B.z1,2,0))continue;
      const cor=planCorridor(A,B,d);
      let ok=true;
      for(const r of cor.rects){if(!chk(r[0],r[1],r[2],r[3],1,A.id+1)){ok=false;break;}}
      if(!ok)continue;
      B.parent=A.id;B.depth=A.depth+1;
      rooms.push(B);fill(B.x0,B.z0,B.x1,B.z1,1);mark(B.x0,B.z0,B.x1,B.z1,2,B.id+1);
      for(const r of cor.rects){fill(r[0],r[1],r[2],r[3],1);mark(r[0],r[1],r[2],r[3],1,500+corrs.length);}

    }

  rooms.push(start);fill(start.x0,start.z0,start.x1,start.z1,1);mark(start.x0,start.z0,start.x1,start.z1,2,1);
  const chain=[start];let prev=start;
  for(let i=1;i<nChain;i++){

  if(!boss)return null;

    return null;
  }
  const keyR=addSide('key',ri(9,12),ri(9,11),Math.max(1,(nChain/2)|0),nChain-1);
  if(!keyR)return null;
  const relicR=addSide('relic',9,9,1,nChain-1);
  const fountR=addSide('fountain',9,9,1,nChain-1);
  /* salles de téléporteurs : à partir de l'étage 3 (3 portails à partir de l'étage 6) */
  const teleRooms=[];
  if(level>=3){
    const usedP=[];
    const addTele=()=>{
      const idxs=[];for(let i=1;i<=nChain-1;i++)idxs.push(i);shuffle(idxs);
      const far=i=>usedP.length?Math.min.apply(null,usedP.map(u=>Math.hypot(chain[i].cx-chain[u].cx,chain[i].cz-chain[u].cz))):0;
      if(usedP.length)idxs.sort((p,q)=>far(q)-far(p));else idxs.sort((p,q)=>p-q);
      for(const i of idxs){const B=growFrom(chain[i],9,9,'tele',[0,1,2,3]);if(B){usedP.push(i);return B;}}
      return null;
    };
    for(let k=0,n=level>=6?3:2;k<n;k++){const T=addTele();if(T)teleRooms.push(T);}
    if(teleRooms.length===1){teleRooms[0].type='combat';teleRooms.length=0;}
  }
  for(let k=0,n=ri(1,2)+((level/2)|0);k<n;k++)addSide('combat',ri(9,13),ri(9,12),1,nChain-1);

  /* noms */
  const names=shuffle(ROOM_NAMES.slice());let ni=0;
  for(const r of rooms){
    r.name=r.type==='start'?'Le Vestibule':r.type==='boss'?'Le Trône de Cendres':r.type==='key'?'Le Sanctuaire':r.type==='relic'?'Le Reliquaire':r.type==='fountain'?'La Source':r.type==='tele'?'La Salle des Portails':names[ni++%names.length];
  }
  /* piliers */
  for(const r of rooms){
    if(r.type==='fountain'||r.type==='relic'||r.type==='tele'||r.w<9||r.h<9)continue;
    const ins=r.type==='boss'?4:2;
    const pts=[[r.x0+ins,r.z0+ins],[r.x1-ins,r.z0+ins],[r.x0+ins,r.z1-ins],[r.x1-ins,r.z1-ins]];
    shuffle(pts);const n=r.type==='boss'?4:(r.type==='start'?0:ri(0,4));
    for(let i=0;i<n;i++)g[pts[i][1]*W+pts[i][0]]=0;
  }
  /* porte du boss */
  const bc=corrs.find(c=>c.to===boss.id);
  const door={cells:bc.endCells,axis:bc.axis,x:bc.endX+.5,z:bc.endZ+.5};
  for(const c of door.cells)g[c[1]*W+c[0]]=2;

  /* pièges : couloirs rectilignes de 3 de large */
  const isF=(x,z)=>g[z*W+x]===1,isW=(x,z)=>g[z*W+x]===0;
  const traps=[],maxTraps=level>=3?3:2;
  const ci=shuffle(corrs.map((c,i)=>i));
  for(const i of ci){
    if(traps.length>=maxTraps)break;
    const c=corrs[i];if(c.from===0||c.to===boss.id||RNG()<.1)continue;
    for(const r of shuffle([c.rects[0],c.rects[2]])){
      let run=[],best=null;
      const fixed=c.axis==='x'?r[1]+1:r[0]+1;
      const lo=c.axis==='x'?r[0]:r[1],hi=c.axis==='x'?r[2]:r[3];
      for(let t=lo;t<=hi+1;t++){
        let tun=false;
        if(t<=hi){
          tun=c.axis==='x'?(isF(t,fixed-1)&&isF(t,fixed)&&isF(t,fixed+1)&&isW(t,fixed-2)&&isW(t,fixed+2))
                          :(isF(fixed-1,t)&&isF(fixed,t)&&isF(fixed+1,t)&&isW(fixed-2,t)&&isW(fixed+2,t));
        }
        if(tun)run.push(t);
        else{if(run.length>=6&&(!best||run.length>best.length))best=run;run=[];}
      }
      if(best){traps.push({axis:c.axis,fixed:fixed,p:best[ri(1,best.length-3)],ph0:RNG()*3.2});break;}
    }
  }
  return {g:g,rooms:rooms,corrs:corrs,chain:chain,start:start,boss:boss,keyRoom:keyR,relicRoom:relicR,fountRoom:fountR,teleRooms:teleRooms,door:door,traps:traps,seed:seed,level:level};
}

let relic=null,fountain=null,shots=[],teleporters=[];
const TORCH_MAT=lit(4,'#2b241f'),POT_MAT=lit(4,'#8d4d2e'),SPIKE_MAT=lit(4,'#aab0b8'),SPIKEB_MAT=lit(4,'#1d1b1a'),PLINTH_MAT=lit(4,'#4a4650');
function partM(parent,geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);parent.add(m);return m;}
function inRoom(r,x,z,m){return x>=r.x0+m&&x<r.x1+1-m&&z>=r.z0+m&&z<r.z1+1-m;}
function roomNameAt(x,z){

  const id=roomMap[tz*W+tx];

  /* portails de téléportation */

function fireShot(e,a,o){
  o=o||{};const sp_=o.sp||6.2,oy=o.oy||2.0;
  const off=o.off||.5;
  const sx=e.halo&&!o.off?e.x+e.halo.position.x:e.x+Math.sin(a)*off,sz=e.halo&&!o.off?e.z+e.halo.position.z:e.z+Math.cos(a)*off;
  const c1=o.c1||'#ff8a3d',c2=o.c2||'#fff0c0';
  const g=new THREE.Group();g.position.set(sx,oy,sz);
  const h1=addHalo(g,c1,1.1,0),h2=addHalo(g,c2,.4,0);
  world.add(g);
  shots.push({y:oy,x:sx,z:sz,vx:Math.sin(a)*sp_,vz:Math.cos(a)*sp_,g:g,h1:h1,h2:h2,life:5,c1:c1,dmg:o.dmg||1});
  if(!o.silent){if(o.snd)Snd[o.snd](e.x,e.z);else Snd.cast(e.x,e.z);}
}
function removeShot(i){
  const s=shots[i];
  emit(s.x,1.1,s.z,8,s.c1||'#ff8a3d',3,.4,.08,6);Snd.shotBurst(s.x,s.z);
  world.remove(s.g);flames=flames.filter(f=>f!==s.h1&&f!==s.h2);shots.splice(i,1);
}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];s.life-=dt;s.x+=s.vx*dt;s.z+=s.vz*dt;s.y+=(1.1-s.y)*Math.min(1,dt*5);s.g.position.set(s.x,s.y,s.z);
    if(Math.random()<dt*30)emit(s.x,1.1,s.z,1,s.c1||'#ffa040',.4,.4,.06,-1);
    if(s.life<=0||blocked(s.x,s.z,.12)){removeShot(i);continue;}
    if(!P.dead&&Math.hypot(P.x-s.x,P.z-s.z)<.55&&hurtPlayer(s.dmg||1,s.x,s.z))removeShot(i);
  }
}
function updMage(e,dt){
  const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),pa=Math.atan2(dx,dz);
  const seen_=d<12&&los(e.x,e.z,P.x,P.z)&&!P.dead;
  e.t-=dt;e.cd-=dt;let warn=0;
  if(e.state==='idle'){if(seen_){e.state='chase';e.cd=1;Snd.growl(e.x,e.z);}}
  else if(e.state==='chase'){
    if(!seen_){e.lost+=dt;if(e.lost>5){e.state='idle';e.lost=0;}}else e.lost=0;
    let tx=e.x,tz=e.z,sp_=0;
    if(d<4.2){tx=e.x-dx;tz=e.z-dz;sp_=2.6;}
    else if(d>7.5){tx=P.x;tz=P.z;sp_=2.2;}
    else{const a=pa+Math.PI/2*e.side;tx=e.x+Math.sin(a)*3;tz=e.z+Math.cos(a)*3;sp_=1.4;}
    steer(e,tx,tz,sp_,dt);
    if(seen_&&e.cd<=0&&d<10){e.state='wind';e.t=.7;Snd.tele(e.x,e.z);}
    if(Math.random()<dt*.35)e.side=-e.side;
  }else if(e.state==='wind'){
    warn=.9;
    if(e.t<=0){const V=e.V;if(V.fan)[-.3,0,.3].forEach((o,i)=>fireShot(e,pa+o,{c1:V.c1,c2:V.c2,sp:V.sp,silent:i>0}));else fireShot(e,pa,{c1:V.c1,c2:V.c2,sp:V.sp});e.state='chase';e.cd=rnd(1.9,2.8);}
  }
  for(const u of e.fu)u.uWarn.value=warn;
  /* animation : flottement, robe et cape à ressorts, bras qui lance le sort */
  const idt=Math.max(dt,.001),vxm=(e.x-e.px)/idt,vzm=(e.z-e.pz)/idt;e.px=e.x;e.pz=e.z;
  e.face=lerpA(e.face,pa,dt*6);

  spr(e.s1,clamp(fwd*.09+Math.sin(timeT*2+e.x)*.04,-.4,.5),dt,50,6);
  spr(e.s2,clamp(-lat*.07+Math.cos(timeT*1.7+e.z)*.04,-.4,.4),dt,50,6);
  spr(e.s3,clamp(.12+fwd*.12+Math.sin(timeT*3.2)*.05,-.2,.9),dt,40,5);
  e.robeG.rotation.x=e.s1.a;e.robeG.rotation.z=e.s2.a;e.cloakG.rotation.x=e.s3.a;
  e.cast+=((e.state==='wind'?1:0)-e.cast)*Math.min(1,dt*9);
  e.armR.rotation.x=-1.0-e.cast*.9;e.armL.rotation.x=-.6-e.cast*.5+Math.sin(timeT*2)*.05;
  e.orb.scale.setScalar(1+e.cast*.9+Math.sin(timeT*8)*.12);
  const sa=e.face,bob=Math.sin(timeT*2.4+e.x)*.1;
  e.halo.position.set(.42*Math.cos(sa)+.44*Math.sin(sa),2.2+bob,-.42*Math.sin(sa)+.44*Math.cos(sa));
  e.halo.scale.setScalar(1+e.cast*.8);
  e.body.rotation.y=e.face;e.body.rotation.x=clamp(fwd*.03,-.12,.15);e.body.position.y=.25+bob;
  e.g.position.set(e.x,0,e.z);
  if(Math.random()<dt*9)emit(e.x+rnd(-.3,.3),.35,e.z+rnd(-.3,.3),1,e.V.em,.4,.6,.06,-1.2,2.2);
}

function decorateBossRoom(lay,T){
  const r=lay.rooms.find(q=>q.type==='boss');if(!r)return;
  const cx=r.cx,cz=r.cz;
  /* emblème d'arène au sol */
  const em=new THREE.Mesh(new THREE.CircleGeometry(1,64).rotateX(-Math.PI/2),glow(ARENA_FS,{uCol:{value:new THREE.Color(T.ring)}}));
  em.scale.setScalar(Math.min(r.w,r.h)*.44);em.position.set(cx,.035,cz);em.renderOrder=2;em.frustumCulled=false;world.add(em);
  /* braseros aux quatre coins (juste à l'intérieur) */
  const mx=r.w/2-1.5,mz=r.h/2-1.5;
  for(const sx of[-1,1])for(const sz of[-1,1]){
    const x=cx+sx*mx,z=cz+sz*mz;
    if(grid[Math.floor(z)*W+Math.floor(x)]===1)addBrazier(x,z);
  }
  /* gros décors le long du périmètre, à l'écart des portes */
  const PM=propMaker(T),list=T.bprops||['rubble'];
  const doors=[];for(let zz=r.z0-1;zz<=r.z1+1;zz++)for(let xx=r.x0-1;xx<=r.x1+1;xx++)if(grid[zz*W+xx]===2)doors.push([xx+.5,zz+.5]);
  const ok=(x,z)=>{
    if(grid[Math.floor(z)*W+Math.floor(x)]!==1)return false;
    for(const d of doors)if(Math.hypot(d[0]-x,d[1]-z)<3.8)return false;
    if(Math.hypot(x-cx,z-cz)<2)return false;
    return true;
  };
  const x0=r.x0+.9,x1=r.x1+1-.9,z0=r.z0+.9,z1=r.z1+1-.9,pts=[];
  for(let x=x0+1.5;x<x1-1;x+=3.1){pts.push([x,z0],[x,z1]);}
  for(let z=z0+1.5;z<z1-1;z+=3.1){pts.push([x0,z],[x1,z]);}
  for(const p of pts){
    if(Math.random()<.18)continue;
    const x=p[0]+rnd(-.2,.2),z=p[1]+rnd(-.2,.2);if(!ok(x,z))continue;
    const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=Math.random()*TAU;
    PM[pick(list)](g,1.8+Math.random()*1.0);world.add(g);
  }
}

function makeEnemy(kind,x,z,room){
  let e;
  switch(kind){
    case 'slime':e=makeSlime(x,z,room);break;
    case 'skel':e=makeSkel(x,z,room);break;
    case 'mage':e=makeMage(x,z,room,MAGE_V.ember);break;
    case 'frost':e=makeMage(x,z,room,MAGE_V.frost);break;
    case 'spider':e=makeSpider(x,z,room);break;
    case 'thorn':e=makeThorn(x,z,room);break;
    case 'crab':e=makeCrab(x,z,room);break;
    case 'jelly':e=makeJelly(x,z,room);break;
    case 'golem':e=makeGolem(x,z,room);break;
    default:e=makeWolf(x,z,room);
  }
  const lvl=L.level,base=HPB[kind]||2,step=kind==='skel'?2:3;
  e.hp=e.maxhp=base+(((lvl-1)/step)|0);
  e.dk=kind;
  return e;
}
function pickKind(T,counts,r){
  const opts=T.roster.filter(o=>(!o.cap||(counts[o.k]||0)<o.cap)&&!(r.type==='relic'&&o.rng));
  const list=opts.length?opts:T.roster;
  let tot=0;for(const o of list)tot+=o.w;
  let v=Math.random()*tot;for(const o of list){v-=o.w;if(v<=0)return o.k;}
  return list[list.length-1].k;
}
function spawnEnemies(){
  const lvl=L.level,T=CUR;
  for(const r of L.rooms){
    if(r.type==='start'||r.type==='fountain'||r.type==='boss'||r.type==='tele')continue;
    let n;
    if(r.type==='combat')n=clamp(Math.round(r.w*r.h/42)+(lvl-1)+ri(-1,0),2,7);
    else if(r.type==='key')n=clamp(3+((lvl/2)|0),3,6);
    else n=2+(lvl>2?1:0);
    const counts={};
    for(let i=0;i<n;i++){
      const p=freeCell(r);if(!p)continue;
      const k=pickKind(T,counts,r);counts[k]=(counts[k]||0)+1;
      enemies.push(makeEnemy(k,p.x,p.z,r.id));
    }
  }
  const b=L.boss;
  boss=makeBossFor(T,b.cx,b.cz);
  boss.hp=boss.maxhp=BOSSDEF[T.boss].hp+3*(lvl-1);
  boss.room=b.id;
  boss.face=Math.atan2(doorObj.x-b.cx,doorObj.z-b.cz);
  enemies.push(boss);
}

/* ============ dangers au sol, attaques propres à chaque boss, pouvoirs du joueur ============ */
let hazards=[],fxList=[];
const ZONE_FS=`
uniform vec3 uCol; uniform float uA;
void main(){
  float r=length(vUv-.5)*2.;
  float edge=smoothstep(.8,.94,r)*(1.-smoothstep(.95,1.,r));
  float n=fbm(vUv*6.+uTime*.6);
  float fill=(1.-smoothstep(0.,1.,r))*.4*(.6+n*.8);
  float a=(fill+edge*.8)*uA*(1.-step(1.,r));
  gl_FragColor=vec4(uCol*(1.1+n*.7),a);
}`;
const WAVE_FS=`
uniform vec3 uCol; uniform float uA;
void main(){
  float e=smoothstep(0.,.25,vUv.y)*smoothstep(1.,.75,vUv.y)*smoothstep(0.,.3,vUv.x)*smoothstep(1.,.7,vUv.x);
  float n=fbm(vec2(vUv.y*8.,uTime*3.));
  gl_FragColor=vec4(uCol*(1.2+n),e*(.5+.4*n)*uA);
}`;

function addWave(axis,pos0,dir,gapC,gapW,o){
  const R=L.boss,lo=axis==='x'?R.z0:R.x0,hi=(axis==='x'?R.z1:R.x1)+1;
  const grp=new THREE.Group(),mat=glow(WAVE_FS,{uCol:{value:new THREE.Color(o.col)},uA:{value:.3}});
  const seg=(a,b)=>{if(b-a<.2)return;const m=new THREE.Mesh(new THREE.PlaneGeometry(1.3,b-a).rotateX(-Math.PI/2),mat);
    if(axis==='x')m.position.set(0,.1,(a+b)/2);else{m.rotation.y=Math.PI/2;m.position.set((a+b)/2,.1,0);}m.renderOrder=4;grp.add(m);};
  seg(lo,gapC-gapW/2);seg(gapC+gapW/2,hi);
  if(axis==='x')grp.position.set(pos0,0,0);else grp.position.set(0,0,pos0);

function clearHazards(){

function explodeBurst(h){
  world.remove(h.mesh);
  emit(h.x,.3,h.z,18,h.col,5,.7,.14,8);
  if(h.vis)spawnSpikes(h.x,h.z,h.vis,5);
  Snd[h.snd](h.x,h.z);FX.shake=Math.max(FX.shake,h.dmg>1?.4:.2);
  if(h.friendly){
    for(const e of enemies){
      if(e.dead||Math.hypot(e.x-h.x,e.z-h.z)>h.r+e.r*.6)continue;
      hitEnemy(e,h.pdmg,h.x,h.z,h.kb==null?4:h.kb);
      if(h.hold&&e.kind!=='boss'&&!e.dead)e.hold=Math.max(e.hold||0,h.hold),e.stun=Math.max(e.stun,h.hold);
    }
  }else if(!P.dead&&Math.hypot(P.x-h.x,P.z-h.z)<h.r)hurtPlayer(h.dmg,h.x,h.z);
  if(h.after)addZone(h.x,h.z,h.after);
}
function updateHazards(dt){
  for(let i=fxList.length-1;i>=0;i--){
    const f=fxList[i];f.t+=dt;const k=f.t/f.life;
    f.g.scale.set(1,Math.min(1,k*5)*(1-Math.max(0,k-.6)/.4),1);
    if(k>=1){world.remove(f.g);fxList.splice(i,1);}
  }
  for(let i=hazards.length-1;i>=0;i--){
    const h=hazards[i];if(!h)continue;
    if(h.k==='burst'){
      h.t+=dt;h.mesh.material.uniforms.uProg.value=Math.min(1,h.t/h.delay);
      if(h.t>=h.delay){explodeBurst(h);hazards.splice(i,1);}
    }else if(h.k==='zone'){
      h.age+=dt;h.life-=dt;
      const fade=Math.min(1,h.age*2)*Math.min(1,h.life*1.5);
      h.mesh.material.uniforms.uA.value=fade;
      if(Math.random()<dt*8)emit(h.x+rnd(-h.r,h.r)*.7,.15,h.z+rnd(-h.r,h.r)*.7,1,h.col,.4,.9,.07,-1.5,2);
      if(h.pull&&!h.friendly&&!P.dead&&h.age>.4){const px_=h.x-P.x,pz_=h.z-P.z,pd_=Math.hypot(px_,pz_);if(pd_<h.r*1.5&&pd_>.35){P.kx+=px_/pd_*h.pull*dt;P.kz+=pz_/pd_*h.pull*dt;}}
      if(h.friendly){h.tk-=dt;if(h.tk<=0){h.tk=h.tick;for(const e of enemies){if(e.dead||e.state==='sleep'||Math.hypot(e.x-h.x,e.z-h.z)>h.r+e.r*.5)continue;hitEnemy(e,h.pdmg||1,h.x,h.z,0);}}}
      else if(!P.dead&&h.age>.5&&Math.hypot(P.x-h.x,P.z-h.z)<h.r*.92){
        if(h.slow)P.slowT=.3;
        h.tk-=dt;
        if(h.tk<=0&&h.dmg>0&&hurtPlayer(h.dmg,h.x,h.z))h.tk=h.tick;
      }
      if(h.life<=0){world.remove(h.mesh);hazards.splice(i,1);}
    }else if(h.k==='wave'){
      h.t+=dt;
      if(h.t<h.delay){h.mat.uniforms.uA.value=.25+.15*Math.sin(h.t*20);continue;}
      h.mat.uniforms.uA.value=1;
      h.pos+=h.dir*h.spd*dt;
      if(h.axis==='x')h.mesh.position.x=h.pos;else h.mesh.position.z=h.pos;
      if(!P.dead){
        const a=h.axis==='x'?P.x:P.z,b=h.axis==='x'?P.z:P.x;
        if(Math.abs(a-h.pos)<.8&&Math.abs(b-h.gapC)>h.gapW/2&&b>h.lo&&b<h.hi)hurtPlayer(h.dmg,h.axis==='x'?h.pos:P.x,h.axis==='x'?P.z:h.pos);
      }
      if(Math.random()<dt*20)emit(h.axis==='x'?h.pos:rnd(h.lo,h.hi),.3,h.axis==='x'?rnd(h.lo,h.hi):h.pos,1,'#bff4ff',1,.5,.09,2);
      if((h.dir>0&&h.pos>h.end)||(h.dir<0&&h.pos<h.end)){world.remove(h.mesh);hazards.splice(i,1);}
    }
  }
}

function roomPt(R,m){return {x:R.x0+m+Math.random()*(R.w-2*m),z:R.z0+m+Math.random()*(R.h-2*m)};}
function sumOk(e){return e.phase===2&&e.sumCd<=0&&enemies.filter(x=>!x.dead&&x.kind!=='boss'&&x.room===L.boss.id).length<2;}
function goSummon(e){e.state='summon';e.t=1.5;e.did=false;Snd.roar(e.x,e.z);}
function goCharge(e){e.state='tele_charge';e.t=.95;e.dir=Math.atan2(P.x-e.x,P.z-e.z);Snd.tele(e.x,e.z);teleStrip.visible=true;}
function goSlam(e){e.state='tele_slam';e.t=.95;Snd.tele(e.x,e.z);teleCircle.visible=true;}
let vulnTip=false;
function goStun(e,t){e.state='stun';e.t=t;if(!vulnTip){vulnTip=true;toast('Il est à découvert : frappe-le !');}}

const BOSS_AI={
 ash(e,d,r){

 },

 },
 crabking(e,d,r){

 },
 forgeron(e,d,r){
  if(sumOk(e)&&r<.35){goSummon(e);return;}

    for(let i=0;i<n;i++){const a=i/n*TAU+Math.random(),rr=i?2.2+Math.random()*1.5:0,x=P.x+Math.sin(a)*rr,z=P.z+Math.cos(a)*rr;if(!blocked(x,z,.5))addZone(x,z,{r:2.6,life:8,tick:1.2,dmg:1,col:'#4fc0ff',slow:true});}

 }
};

/* états des attaques propres aux boss, appelés par updBoss : renvoie [angle des bras, intensité des yeux] */
function bossExtra(e,dt,d,pa){
  let arm=-2.7,eye=2;
  const st=e.state;
  if(st!=='blink')e.face=lerpA(e.face,pa,dt*2.2);
  if(st==='sweep_w'){
    teleCircle.position.set(e.x,.05,e.z);teleCircle.scale.setScalar(e.r+2.8);
    teleCircle.material.uniforms.uProg.value=1-Math.max(0,e.t/.9);teleCircle.material.uniforms.uA.value=1;
    if(e.t<=0){
      teleCircle.visible=false;
      if(d<e.r+2.8&&Math.abs(angDiff(e.face,pa))<1.4)hurtPlayer(2,e.x,e.z);
      emit(e.x+Math.sin(e.face)*2,.3,e.z+Math.cos(e.face)*2,16,e.def.fx,5,.6,.14,8);Snd.slam(e.x,e.z);FX.shake=.6;
      e.state='rec';e.t=1.0;
    }
  }else if(st==='roots_w'){if(e.t<=0)goStun(e,1.9);}
  else if(st==='spores_w'){if(e.t<=0){e.state='rec';e.t=.9;}}
  else if(st==='bub_w'){
    if(e.t<=0){
      const n=e.phase===2?14:10;
      for(let i=0;i<n;i++)fireShot(e,i/n*TAU+(e.phase===2?.2:0),{c1:'#7fe8ff',c2:'#ffffff',sp:3.4,oy:1.1,off:e.r+.3,silent:i>0});
      if(e.phase===2){const pa2=Math.atan2(P.x-e.x,P.z-e.z);[-.25,0,.25].forEach(o=>fireShot(e,pa2+o,{c1:'#7fe8ff',c2:'#ffffff',sp:5.2,oy:1.1,off:e.r+.3,silent:true}));}
      e.state='rec';e.t=.9;
    }
  }else if(st==='tide_w'){arm=-2.2;if(e.t<=0){e.state='rec';e.t=1.3;}}
  else if(st==='met_w'){if(e.t<=0)goStun(e,1.8);}
  else if(st==='pool_w'){if(e.t<=0){e.state='rec';e.t=.9;}}
  else if(st==='blink'){
    arm=-1.2;
    teleCircle.position.set(e.bx,.05,e.bz);teleCircle.scale.setScalar(3.2);
    teleCircle.material.uniforms.uProg.value=1-Math.max(0,e.t/.95);teleCircle.material.uniforms.uA.value=1;
    if(e.t<.75&&!e.invis){e.invis=true;e.g.visible=false;emit(e.x,1.5,e.z,24,e.def.fx||'#bfe6ff',5,.8,.12,2);}
    if(e.t<=0){
      e.invis=false;e.g.visible=true;e.x=e.bx;e.z=e.bz;teleCircle.visible=false;
      emit(e.x,1.5,e.z,30,e.def.fx||'#bfe6ff',6,.8,.14,2);
      pushShock(e.x,e.z,{r:.8,max:5,sp:9,dmg:1,col:e.def.ring,snd:'zap',band:.8,shk:.4});
      e.state='rec';e.t=1.3;
    }
  }else if(st==='cast_w'){
    if(e.t<=0){
      const n=7;
      for(let i=0;i<n;i++)fireShot(e,pa+(i-(n-1)/2)*.22,{c1:'#7fc8ff',c2:'#ffffff',sp:5.4,oy:1.4,off:e.r+.3,silent:i>0});
      if(e.phase===2)for(let i=0;i<10;i++)fireShot(e,i/10*TAU,{c1:'#7fc8ff',c2:'#ffffff',sp:3.2,oy:1.4,off:e.r+.3,silent:true});
      e.state='rec';e.t=.9;
    }
  }else if(st==='bliz_w'){if(e.t<=0){e.state='rec';e.t=1.0;}}
  else{e.state='chase';e.t=.5;}
  return [arm,eye];
}

/* ---------- pouvoirs du joueur : un par boss vaincu ---------- */
const POWERS={
 nova:{id:'nova',name:'Nova de braise',ic:'🔥',cd:8,col:'#ff8a3d',txt:'Onde de feu autour de toi'},
 roots:{id:'roots',name:'Racines',ic:'🌿',cd:9,col:'#9aff4a',txt:'Des racines immobilisent les ennemis devant toi'},
 tide:{id:'tide',name:'Courant',ic:'🌊',cd:6,col:'#4fe0ff',txt:'Ruée aquatique invulnérable qui frappe tout sur son passage'},
 meteor:{id:'meteor',name:'Météores',ic:'☄️',cd:12,col:'#ff5a1a',txt:'Des météores s’abattent sur les ennemis'},
 frost:{id:'frost',name:'Gel',ic:'❄️',cd:14,col:'#9ad8ff',txt:'Fige les ennemis proches : ils encaissent le double'}
};
const POWER_OF={ash:'nova',treant:'roots',crabking:'tide',forgeron:'meteor',queen:'frost'};
function grantPower(def){
  const id=POWER_OF[def.id];if(!id||P.powers.includes(id))return;
  P.powers.push(id);P.pcd[id]=0;syncSlots();
  let msg='Raccourcis : appuie sur un bouton de pouvoir pour l’utiliser';
  if(!P.slots.includes(id)){P.slots[2]=id;msg='Placé en 3ᵉ raccourci · maintiens un raccourci pour changer son pouvoir';}
  else if(P.powers.length>3)msg='Maintiens un raccourci pour changer son pouvoir';
  banner('Pouvoir : '+POWERS[id].name,POWERS[id].txt,4200);
  toast(msg);
}
function syncSlots(){
  if(!P.slots)P.slots=[null,null,null];
  for(let i=0;i<3;i++)if(P.slots[i]&&!P.powers.includes(P.slots[i]))P.slots[i]=null;
  for(const id of P.powers)if(!P.slots.includes(id)){const k=P.slots.indexOf(null);if(k>=0)P.slots[k]=id;}
}
let coolToast=0;
function usePower(slot){
  syncSlots();const pw=POWERS[P.slots[slot||0]];if(!pw||P.dead||G.state!=='play')return false;
  if(P.pcd[pw.id]>0){if(coolToast<=0){coolToast=1.2;toast(pw.name+' se recharge…');}return false;}
  P.pcd[pw.id]=pw.cd;
  const px=P.x,pz=P.z,fx=Math.sin(P.face),fz=Math.cos(P.face);
  if(pw.id==='nova'){
    pushShock(px,pz,{r:.6,max:5.4,sp:11,col:pw.col,snd:'pNova',band:1,shk:.5,friendly:true,pdmg:2,kb:11,hs:new Set()});
    emit(px,.5,pz,30,pw.col,7,.7,.15,3);FX.fl=.3;FX.flx=px;FX.flz=pz;FX.flc=[1,.5,.2];
  }else if(pw.id==='roots'){
    Snd.pRoots(px,pz);
    for(let i=0;i<5;i++){
      const dd=1.8+i*1.35,x=px+fx*dd,z=pz+fz*dd;if(blocked(x,z,.3))break;
      addBurst(x,z,{r:1.15,delay:.25+i*.12,col:pw.col,snd:'burst',friendly:true,pdmg:2,hold:2.4,kb:2,vis:'#4a3320'});
    }
  }else if(pw.id==='tide'){
    P.rdx=fx;P.rdz=fz;P.rollT=.3;P.rollCd=.5;P.dash=true;P.dashHit=new Set();P.inv=Math.max(P.inv,.5);
    P.at=-1;P.queued=false;slashArc.visible=false;Snd.pDash(px,pz);
  }else if(pw.id==='meteor'){
    Snd.pMeteor(px,pz);
    const tg=enemies.filter(e=>!e.dead&&e.state!=='sleep'&&Math.hypot(e.x-px,e.z-pz)<13).sort((a,b)=>Math.hypot(a.x-px,a.z-pz)-Math.hypot(b.x-px,b.z-pz)).slice(0,4);
    let k=0;
    for(const e of tg)addBurst(e.x,e.z,{r:1.7,delay:.7+(k++)*.15,col:pw.col,snd:'slam',friendly:true,pdmg:3,kb:7});
    for(;k<3;k++){const a=P.face+(k-1)*.7,dd=4+k,x=px+Math.sin(a)*dd,z=pz+Math.cos(a)*dd;if(!blocked(x,z,.3))addBurst(x,z,{r:1.7,delay:.7+k*.15,col:pw.col,snd:'slam',friendly:true,pdmg:3,kb:7});}
  }else if(NEWPOW[pw.id]){
    NEWPOW[pw.id](pw,px,pz,fx,fz);
  }else{
    Snd.pFreeze(px,pz);
    pushShock(px,pz,{r:.6,max:8,sp:14,col:pw.col,snd:'pFreeze2',band:0,shk:.2,friendly:true,pdmg:0,hs:new Set()});
    emit(px,1,pz,40,'#dff0ff',7,1,.14,2);FX.fl=.3;FX.flx=px;FX.flz=pz;FX.flc=[.5,.8,1];
    for(const e of enemies){
      if(e.dead||Math.hypot(e.x-px,e.z-pz)>8)continue;
      if(e.kind==='boss'){if(e.state!=='sleep'&&e.state!=='intro'&&e.state!=='dying'){e.slowT=4;hitEnemy(e,1,px,pz,0);}}
      else{e.froz=3.5;e.hold=3.5;e.stun=3.5;if(e.state==='idle')e.state='chase';}
    }
  }
  pwKey='';return true;
}
let pwKey='';
function updatePowers(dt){
  coolToast-=dt;if(P.eyeT>0)P.eyeT-=dt;
  for(const id of P.powers)if(P.pcd[id]>0)P.pcd[id]=Math.max(0,P.pcd[id]-dt);
  if(IN.powBuf>0){IN.powBuf=0;const sl=IN.powSlot||0;IN.powSlot=0;usePower(sl);}
  if(P.dash){
    if(P.rollT<=0||P.dead)P.dash=false;
    else{
      emit(P.x,.6,P.z,1,'#4fe0ff',1.5,.4,.12,1);
      for(const e of enemies){
        if(e.dead||P.dashHit.has(e)||Math.hypot(e.x-P.x,e.z-P.z)>e.r+1.0)continue;
        P.dashHit.add(e);hitEnemy(e,2,P.x-P.rdx,P.z-P.rdz,9);
      }
    }
  }
  /* interface : trois raccourcis */
  syncSlots();
  const n=Math.min(3,P.powers.length),wrap=$('pwWrap');
  const key=P.slots.map(id=>id?id+':'+Math.ceil((P.pcd[id]||0)*4):'-').join(',')+'|'+n;
  if(key!==pwKey){
    pwKey=key;wrap.hidden=n===0;
    for(let i=0;i<3;i++){
      const b=$('btnPw'+i),pw=POWERS[P.slots[i]];b.hidden=i>=n;
      if(!pw){b.textContent='+';b.classList.add('empty');b.style.background='';b.style.setProperty('--pc','#888');b.setAttribute('aria-label','Raccourci vide');}
      else{
        const fr=(P.pcd[pw.id]||0)/pw.cd;b.classList.remove('empty');
        b.style.setProperty('--pc',pw.col);
        b.style.background=fr>0?'conic-gradient(rgba(0,0,0,.65) '+(fr*360)+'deg, rgba(255,255,255,.08) 0)':'';
        b.textContent=pw.ic;b.setAttribute('aria-label',pw.name);
      }
    }
  }
}
/* ============ héros articulé (hanches, genoux, chevilles, torse, épaules, coudes, poignets, tête)
   + vrais tissus simulés (Verlet : contraintes, collisions avec le corps, résistance de l'air) ============ */

/* ---------- tissu ---------- */
function makeHeroCloth(frame,pts,cons,pins,tris,color){
  const n=pts.length;
  const c={frame:frame,n:n,loc:pts,pinned:new Uint8Array(n),x:new Float32Array(n*3),p:new Float32Array(n*3),a:new Float32Array(n*3),cons:[],tris:tris,inited:false,tmp:new THREE.Vector3(),wgt:null};
  pins.forEach(i=>{c.pinned[i]=1;});
  for(let i=0;i<cons.length;i++){
    const a=cons[i][0],b=cons[i][1],k=cons[i][2];
    c.cons.push([a,b,Math.hypot(pts[a][0]-pts[b][0],pts[a][1]-pts[b][1],pts[a][2]-pts[b][2]),k]);
  }
  c.pos=new Float32Array(n*3);c.nor=new Float32Array(n*3);
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(c.pos,3));
  geo.setAttribute('normal',new THREE.BufferAttribute(c.nor,3));
  geo.setIndex(tris);
  const mat=lit(4,color);mat.side=THREE.DoubleSide;
  c.mesh=new THREE.Mesh(geo,mat);c.mesh.frustumCulled=false;c.mesh.renderOrder=1;world.add(c.mesh);c.geo=geo;
  return c;
}
function clothPin(c,i){
  const l=c.loc[i],v=c.tmp.set(l[0],l[1],l[2]);c.frame.localToWorld(v);
  c.x[i*3]=v.x;c.x[i*3+1]=v.y;c.x[i*3+2]=v.z;
}
function clothInit(c){
  for(let i=0;i<c.n;i++){clothPin(c,i);c.p[i*3]=c.x[i*3];c.p[i*3+1]=c.x[i*3+1];c.p[i*3+2]=c.x[i*3+2];}
  c.inited=true;
}
function clothStep(c,h,caps,gust,air){
  const n=c.n,x=c.x,p=c.p,a=c.a,T=c.tris;
  for(let i=0;i<n;i++)if(c.pinned[i])clothPin(c,i);
  /* résistance de l'air : chaque triangle pousse selon sa normale et la vitesse relative */
  a.fill(0);
  for(let t=0;t<T.length;t+=3){
    const i0=T[t]*3,i1=T[t+1]*3,i2=T[t+2]*3;
    const e1x=x[i1]-x[i0],e1y=x[i1+1]-x[i0+1],e1z=x[i1+2]-x[i0+2],e2x=x[i2]-x[i0],e2y=x[i2+1]-x[i0+1],e2z=x[i2+2]-x[i0+2];
    let nx=e1y*e2z-e1z*e2y,ny=e1z*e2x-e1x*e2z,nz=e1x*e2y-e1y*e2x;
    const nl=Math.hypot(nx,ny,nz);if(nl<1e-8)continue;
    nx/=nl;ny/=nl;nz/=nl;
    const vx=((x[i0]-p[i0])+(x[i1]-p[i1])+(x[i2]-p[i2]))/(3*h)-gust[0],
          vy=((x[i0+1]-p[i0+1])+(x[i1+1]-p[i1+1])+(x[i2+1]-p[i2+1]))/(3*h)-gust[1],
          vz=((x[i0+2]-p[i0+2])+(x[i1+2]-p[i1+2])+(x[i2+2]-p[i2+2]))/(3*h)-gust[2];
    const f=-(nx*vx+ny*vy+nz*vz)*nl*.5*air/3;
    const fx=nx*f,fy=ny*f,fz=nz*f;
    a[i0]+=fx;a[i0+1]+=fy;a[i0+2]+=fz;a[i1]+=fx;a[i1+1]+=fy;a[i1+2]+=fz;a[i2]+=fx;a[i2+1]+=fy;a[i2+2]+=fz;
  }
  const h2=h*h,damp=.992;
  for(let i=0;i<n;i++){
    if(c.pinned[i])continue;
    const k=i*3;
    for(let d=0;d<3;d++){
      const cur=x[k+d],vel=(cur-p[k+d])*damp;
      p[k+d]=cur;
      x[k+d]=cur+vel+(a[k+d]+(d===1?-13:0))*h2;
    }
  }
  for(let it=0;it<5;it++){
    for(let j=0;j<c.cons.length;j++){
      const cn=c.cons[j],ia=cn[0]*3,ib=cn[1]*3;
      const dx=x[ib]-x[ia],dy=x[ib+1]-x[ia+1],dz=x[ib+2]-x[ia+2];
      const len=Math.hypot(dx,dy,dz);if(len<1e-7)continue;

      const diff=(len-cn[2])/len*cn[3]/ws;
      x[ia]+=dx*diff*wa;x[ia+1]+=dy*diff*wa;x[ia+2]+=dz*diff*wa;
      x[ib]-=dx*diff*wb;x[ib+1]-=dy*diff*wb;x[ib+2]-=dz*diff*wb;
    }
    /* collisions : capsules du corps + sol */
    for(let i=0;i<n;i++){
      if(c.pinned[i])continue;

      for(let q=0;q<caps.length;q++){
        const cp=caps[q],abx=cp[3]-cp[0],aby=cp[4]-cp[1],abz=cp[5]-cp[2];
        const apx=x[k]-cp[0],apy=x[k+1]-cp[1],apz=x[k+2]-cp[2];
        let t=(apx*abx+apy*aby+apz*abz)/(abx*abx+aby*aby+abz*abz+1e-9);t=t<0?0:t>1?1:t;
        const qx=x[k]-(cp[0]+abx*t),qy=x[k+1]-(cp[1]+aby*t),qz=x[k+2]-(cp[2]+abz*t);
        const dd=Math.hypot(qx,qy,qz),r=cp[6]+.012;

      }
      if(x[k+1]<.03)x[k+1]=.03;
    }
  }
}
function clothWrite(c){

function gridTris(nc,nr,wrap){
  const t=[],cols=wrap?nc:nc-1;

    t.push(a,b,c,a,c,d);

}
function gridCons(nc,nr,wrap){
  const k=[],id=(i,j)=>j*nc+((i%nc)+nc)%nc,cols=wrap?nc:nc-1;
  for(let j=0;j<nr;j++)for(let i=0;i<(wrap?nc:nc);i++){
    if(i<cols)k.push([id(i,j),id(i+1,j),1]);
    if(j<nr-1)k.push([id(i,j),id(i,j+1),1]);
    if(j<nr-1&&i<cols){k.push([id(i,j),id(i+1,j+1),.55]);k.push([id(i+1,j),id(i,j+1),.55]);}
    if(j<nr-2)k.push([id(i,j),id(i,j+2),.25]);
    if(i<cols-1||wrap)k.push([id(i,j),id(i+2,j),.2]);
  }
  return k;
}

/* ---------- cinématique inverse à deux segments pour le bras tenant l'épée ---------- */
function eulerFromBasis(X,Y,Z){
  const m13=Z[0],m23=Z[1],m33=Z[2],m12=Y[0],m11=X[0],m22=Y[1],m32=Y[2];
  const ey=Math.asin(Math.max(-1,Math.min(1,m13)));
  if(Math.abs(m13)<.9999)return [Math.atan2(-m23,m33),ey,Math.atan2(-m12,m11)];
  return [Math.atan2(m32,m22),ey,0];
}
function armIK(arm,sx,t){
  const sh=arm.sh,s=sh.position,a=.3,b=.28;
  let dx=t[0]-s.x,dy=t[1]-s.y,dz=t[2]-s.z,d=Math.hypot(dx,dy,dz);
  if(d<1e-5){dx=0;dy=-1;dz=0;d=1;}
  const dmax=a+b-.012,dmin=.14,dc=Math.max(dmin,Math.min(dmax,d));
  const nx=dx/d,ny=dy/d,nz=dz/d;
  const cosA=Math.max(-1,Math.min(1,(a*a+dc*dc-b*b)/(2*a*dc))),alpha=Math.acos(cosA),sinA=Math.sin(alpha);
  const px=sx*.5,py=-.25,pz=-.65,pd=px*nx+py*ny+pz*nz;
  let qx=px-nx*pd,qy=py-ny*pd,qz=pz-nz*pd,ql=Math.hypot(qx,qy,qz);
  if(ql<1e-4){qx=0;qy=0;qz=-1;ql=1;}
  qx/=ql;qy/=ql;qz/=ql;
  const ux=nx*cosA+qx*sinA,uy=ny*cosA+qy*sinA,uz=nz*cosA+qz*sinA;
  const ex=s.x+ux*a,ey=s.y+uy*a,ez=s.z+uz*a;
  const tx=s.x+nx*dc,ty=s.y+ny*dc,tz=s.z+nz*dc;
  let fx=(tx-ex)/b,fy=(ty-ey)/b,fz=(tz-ez)/b;
  const fu=fx*ux+fy*uy+fz*uz;
  let zx=fx-ux*fu,zy=fy-uy*fu,zz=fz-uz*fu,zl=Math.hypot(zx,zy,zz);
  if(zl<1e-4){zx=qx;zy=qy;zz=qz;zl=1;}
  zx/=zl;zy/=zl;zz/=zl;
  const Y=[-ux,-uy,-uz],Z=[zx,zy,zz];
  const X=[Y[1]*Z[2]-Y[2]*Z[1],Y[2]*Z[0]-Y[0]*Z[2],Y[0]*Z[1]-Y[1]*Z[0]];
  const e=eulerFromBasis(X,Y,Z);
  sh.rotation.set(e[0],e[1],e[2]);
  const cosG=Math.max(-1,Math.min(1,(a*a+b*b-dc*dc)/(2*a*b)));
  arm.el.rotation.set(-(Math.PI-Math.acos(cosG)),0,0);
}

/* ---------- animation du squelette ---------- */
const ez=(o,v,dt,r)=>{o.v=(o.v||0);return o;};
function sm(cur,target,dt,rate){return cur+(target-cur)*Math.min(1,dt*rate);}
function poseHero(dt,sp_){
  const m=P.m,st=m.st,tt=timeT,wk=P.walk,sf=clamp(sp_/5,0,1);
  const atk=P.at>=0?1:0,roll=P.rollT>0?1:0;
  st.tuck=sm(st.tuck,roll,dt,22);st.att=sm(st.att,atk,dt,16);
  const tuck=st.tuck,att=st.att,idle=1-sf;
  const run=sf*(1-tuck)*(1-att*.7);
  const breathe=Math.sin(tt*1.9)*.5+.5;
  const swYaw=m.sw.rotation.y,swPit=m.sw.rotation.x;

  /* bassin */
  m.pelvis.position.y=.74+Math.abs(Math.sin(wk))*.045*run-att*.05-tuck*.12-idle*breathe*.006;
  m.pelvis.rotation.set(run*.13+att*.08+tuck*.5,Math.sin(wk)*.14*run+att*.25*(P.combo%2?-1:1),Math.sin(wk)*.05*run,'XYZ');
  /* jambes */
  for(let s=0;s<2;s++){
    const L=m.legs[s],ph=wk+(s?Math.PI:0),A=.82*sf*(1-tuck);
    const hipRun=Math.sin(ph)*A,kneeRun=(.12+1.0*Math.max(0,-Math.cos(ph)))*sf*(1-tuck)+.04*idle;
    const stance=s?.3:-.35;/* en garde : jambe gauche devant */
    const hipAtk=stance*att,kneeAtk=(s?.25:.4)*att;
    const hip=hipRun*(1-att)+hipAtk+(s?-.03:.03)*idle-1.25*tuck;
    const knee=kneeRun*(1-att)+kneeAtk+(s?.06:.03)*idle*breathe+1.7*tuck;
    L.hip.rotation.set(hip,0,(s?-1:1)*(.035+att*.07));
    L.knee.rotation.set(knee,0,0);
    L.ankle.rotation.set(-(hip+knee)*.5+Math.max(0,Math.sin(ph))*.25*sf*(1-tuck),0,0);
  }
  /* torse, tête */
  m.torso.rotation.set(.05+run*.07+att*.1+tuck*.35+breathe*.012*idle,-Math.sin(wk)*.15*run+swYaw*.3*att,-Math.sin(wk)*.03*run,'XYZ');
  m.neck.rotation.set(-m.torso.rotation.x*.5+.02,-(m.torso.rotation.y+m.pelvis.rotation.y)*.45,-m.torso.rotation.z*.5,'XYZ');
  /* capuche : ressort sur le mouvement de la tête */
  {
    const fwd=P.vx*Math.sin(P.face)+P.vz*Math.cos(P.face);
    spr(st.tip,clamp(fwd*.05+Math.sin(tt*2.7)*.04,-.4,.4),dt,60,6);
    m.tipG.rotation.x=st.tip.a;
  }
  /* bras gauche (bouclier) : cinématique directe, balancier opposé aux jambes */
  {
    const A=m.armL,sw_=Math.sin(wk)*.4*run;
    A.sh.rotation.set(-.35+sw_-tuck*.5-att*.15,0,.14+att*.05);
    A.el.rotation.set(-(.95+Math.abs(sw_)*.3+tuck*.4),0,0);
    A.wr.rotation.set(0,0,0);
  }
  /* bras droit : la main va chercher la poignée de l'épée */
  {
    const hx=.3+Math.sin(swYaw)*.26,
          hy=1.25-.24+(.9-swPit)*.08+Math.abs(Math.sin(wk))*.02*run-tuck*.1,
          hz=Math.cos(swYaw)*.22+.06+Math.sin(wk)*.04*run+tuck*.05;
    st.hx=sm(st.hx,hx,dt,30);st.hy=sm(st.hy,hy,dt,30);st.hz=sm(st.hz,hz,dt,30);
    /* position de la poignée dans le repère racine → repère du torse */
    const gx=st.hx,gy=st.hy,gz=st.hz;
    m.g.updateMatrixWorld(true);
    const v=P.tmpV||(P.tmpV=new THREE.Vector3());
    v.set(gx,gy,gz);m.g.localToWorld(v);m.torso.worldToLocal(v);
    armIK(m.armR,1,[v.x,v.y,v.z]);
    /* l'épée se place sur la main */
    const sy=Math.sin(swYaw),cyw=Math.cos(swYaw),sxp=Math.sin(swPit),cxp=Math.cos(swPit);
    m.sw.position.set(gx-.12*sy,gy+.12*cyw*sxp,gz-.12*cyw*cxp);
  }
  /* repère racine : position, orientation, roulade */
  if(P.rollT>0){
    const rt=P.dash?.3:.36,pr=1-P.rollT/rt;
    m.g.position.set(P.x,.75*Math.min(1,pr*6)*Math.min(1,(1-pr)*6),P.z);
    m.g.rotation.y=P.face;m.g.rotation.x=pr*TAU;m.g.scale.set(1,.55,1);
  }else{
    m.g.position.set(P.x,0,P.z);m.g.rotation.y=P.face;m.g.rotation.x=0;m.g.scale.set(1,1,1);
  }
  const vis=!(P.inv>0&&Math.floor(timeT*22)%2===0);
  m.g.visible=vis;for(const c of m.cloth)c.mesh.visible=vis;
}

const _w=[new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()];
function heroCloth(dt){
  const m=P.m;if(!m)return;
  m.g.updateMatrixWorld(true);
  const W=(o,x,y,z,i)=>{const v=_w[i];v.set(x,y,z);o.localToWorld(v);return v;};
  const pel=W(m.pelvis,0,0,0,0),chest=W(m.torso,0,.4,0,1);
  const hL=W(m.legs[0].hip,0,0,0,2),kL=W(m.legs[0].knee,0,0,0,3),aL=W(m.legs[0].ankle,0,0,0,4);
  const caps=[[pel.x,pel.y,pel.z,chest.x,chest.y,chest.z,.18],[hL.x,hL.y,hL.z,kL.x,kL.y,kL.z,.1],[kL.x,kL.y,kL.z,aL.x,aL.y,aL.z,.075]];
  const hR=W(m.legs[1].hip,0,0,0,2),kR=W(m.legs[1].knee,0,0,0,3),aR=W(m.legs[1].ankle,0,0,0,4);
  caps.push([hR.x,hR.y,hR.z,kR.x,kR.y,kR.z,.1],[kR.x,kR.y,kR.z,aR.x,aR.y,aR.z,.075]);
  for(const c of m.cloth)if(!c.inited)clothInit(c);
  const steps=Math.max(1,Math.min(4,Math.ceil(dt/(1/90)))),h=Math.max(1e-4,Math.min(dt,.05))/steps;
  const gust=[Math.sin(timeT*1.3)*.25,0,Math.cos(timeT*.9)*.25];
  if(dt>0)for(let s=0;s<steps;s++)for(let i=0;i<m.cloth.length;i++)clothStep(m.cloth[i],h,caps,gust,i===0?2.2:3.2);
  for(const c of m.cloth)clothWrite(c);
}
function placeHero(){
  const m=P.m;m.st.hx=.3;m.st.hy=1.0;m.st.hz=.2;
  poseHero(0,0);m.g.updateMatrixWorld(true);
  for(const c of m.cloth)c.inited=false;
  heroCloth(1/60);
}

function updBrute(e,dt){
  const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),pa=Math.atan2(dx,dz);
  const seen=d<10&&los(e.x,e.z,P.x,P.z)&&!P.dead;
  e.cd-=dt;e.t-=dt;let warn=0,arms=-.15,run=0;
  if(e.state==='idle'){if(seen){e.state='chase';e.aggro=5;Snd.growl(e.x,e.z);}}
  else if(e.state==='chase'){
    if(seen)e.aggro=5;else e.aggro-=dt;
    if(e.aggro<=0)e.state='idle';
    e.face=lerpA(e.face,pa,dt*3);if(d>1.8){steer(e,P.x,P.z,e.sp,dt);run=1;}
    if(d<e.reach&&e.cd<=0&&seen){e.state='wind';e.t=e.wt;Snd.tele(e.x,e.z);}
  }else if(e.state==='wind'){
    warn=.9;arms=-2.5*(1-Math.max(0,e.t)/e.wt)-.15;e.face=lerpA(e.face,pa,dt*4);
    if(e.t<=0){
      pushShock(e.x,e.z,{r:.9,max:e.rg+.6,sp:7,dmg:1,col:e.col,snd:'slam',band:.8,shk:.5});
      emit(e.x,.2,e.z,18,e.col,5,.7,.14,8);e.state='rec';e.t=1.1;
    }
  }else if(e.state==='rec'){arms=.3;if(e.t<=0){e.state='chase';e.cd=e.rc;}}
  for(const u of e.fu)u.uWarn.value=warn;
  e.walk+=dt*run*4;
  e.armL.rotation.x+=(arms+Math.sin(e.walk)*.3*run-e.armL.rotation.x)*Math.min(1,dt*9);
  e.armR.rotation.x+=(arms-Math.sin(e.walk)*.3*run-e.armR.rotation.x)*Math.min(1,dt*9);
  e.body.position.y=Math.abs(Math.sin(e.walk))*.05*run;
  e.g.position.set(e.x,0,e.z);e.g.rotation.y=e.face;
}

function goCast(e,t,fire,aft,aftT){e.state='cast2';e.t=t;e.fire=fire;e.aft=aft||'rec';e.aftT=aftT||1;Snd.tele(e.x,e.z);}

bossExtra=function(e,dt,d,pa){
  if(e.state==='cast2'){
    e.face=lerpA(e.face,pa,dt*2.2);
    if(e.t<=0){const f=e.fire;e.fire=null;if(f)f(e);if(e.aft==='stun')goStun(e,e.aftT);else{e.state='rec';e.t=e.aftT;}}

  }

};
function waveAttack(col,spd,gapW,axis,delay){
  const R=L.boss,dir=Math.random()<.5?1:-1;
  const gc=axis==='x'?R.z0+2.5+Math.random()*(R.h-5):R.x0+2.5+Math.random()*(R.w-5);
  addWave(axis,axis==='x'?(dir>0?R.x0-1:R.x1+2):(dir>0?R.z0-1:R.z1+2),dir,gc,gapW,{col:col,delay:delay,spd:spd});
}
function goBlink(e){
  e.state='blink';e.t=.95;Snd.tele(e.x,e.z);
  let dx=P.x-Math.sin(P.face)*2.6,dz=P.z-Math.cos(P.face)*2.6;

/* ---------- salles de téléporteurs ---------- */
function updateTele(dt){
  if(!teleporters.length)return;
  for(const t of teleporters){
    const d=Math.hypot(P.x-t.x,P.z-t.z);
    if(!t.armed&&d>2.2)t.armed=true;
    if(t.armed&&d<1.2&&!P.dead)t.charge=Math.min(1,t.charge+dt/.9);else t.charge=Math.max(0,t.charge-dt*2);
    t.halo.scale.setScalar(1+t.charge*1.3+Math.sin(timeT*3+t.i)*.05);
    if(Math.random()<dt*(6+t.charge*50)){const a=Math.random()*TAU;emit(t.x+Math.cos(a)*1.1,.25,t.z+Math.sin(a)*1.1,1,'#9ad0ff',1.2,.8,.1,-3);}
    if(t.charge>=1){doTele(t);return;}
  }
}
function doTele(from){
  const to=teleporters[(from.i+1)%teleporters.length];
  emit(P.x,1,P.z,40,'#9ad0ff',6,.8,.14,-1);Snd.pFreeze(P.x,P.z);
  from.charge=0;from.armed=false;to.charge=0;to.armed=false;
  P.x=to.x;P.z=to.z+2.4;P.vx=P.vz=0;P.kx=P.kz=0;cam.x=P.x;cam.z=P.z;
  FX.fl=.5;FX.flx=to.x;FX.flz=to.z;FX.flc=[.6,.8,1.2];
  emit(P.x,1,P.z,40,'#9ad0ff',6,.8,.14,-1);Snd.pFreeze(P.x,P.z);
  for(const e of enemies)if(!e.dead&&e.kind!=='boss'&&e.state!=='sleep'&&Math.hypot(e.x-P.x,e.z-P.z)>8)e.state='idle';
  for(let i=shots.length-1;i>=0;i--)removeShot(i);
  toast('Portail · '+to.room.name);
}

/* ---- scarabée des sables : s'enfouit et surgit sous tes pieds ---- */
function updScarab(e,dt){
  const dx=P.x-e.x,dz=P.z-e.z,d=Math.hypot(dx,dz),pa=Math.atan2(dx,dz);
  const seen=d<11&&los(e.x,e.z,P.x,P.z)&&!P.dead;
  e.cd-=dt;e.t-=dt;let run=0,sink=0,warn=0;
  if(e.state==='idle'){if(seen){e.state='chase';e.aggro=5;e.cd=1;Snd.growl(e.x,e.z);}}
  else if(e.state==='chase'){
    if(seen)e.aggro=5;else e.aggro-=dt;
    if(e.aggro<=0)e.state='idle';
    e.face=lerpA(e.face,pa,dt*7);

/* =====================================================================
   Boss : séquences à répétition + nouvelles attaques
   ===================================================================== */
function goSeq(e,t,tick,fn,aft,aftT,track){
  e.state='seq';e.t=t;e.sq={n:0,acc:tick*.999,tick:tick,fn:fn,track:track!==false};e.aft=aft||'rec';e.aftT=aftT||1.1;Snd.tele(e.x,e.z);
}
function goLaser(e){
  const pa=Math.atan2(P.x-e.x,P.z-e.z),s=Math.random()<.5?1:-1,p2=e.phase===2;
  e.state='laser';e.lt=p2?1.7:2.2;e.t=1.0+e.lt;e.ls=s;e.la0=pa-s*1.0;e.lsw=2.0;e.hitDone=false;
  Snd.tele(e.x,e.z);teleStrip.visible=true;
}
const _bossExtra2=bossExtra;
bossExtra=function(e,dt,d,pa){
  if(e.state==='seq'){
    const q=e.sq;if(q.track)e.face=lerpA(e.face,pa,dt*2);
    q.acc+=dt;
    while(q.acc>=q.tick){q.acc-=q.tick;q.fn(e,q.n++);}
    if(e.t<=0){if(e.aft==='stun')goStun(e,e.aftT);else{e.state='rec';e.t=e.aftT;}}
    return [-2.0+Math.sin(timeT*10)*.4,-2.0-Math.sin(timeT*10)*.4];
  }
  if(e.state==='laser'){
    const sweepT=e.lt,tel=e.t-sweepT;
    let ang;
    if(tel>0){ang=e.la0;teleStrip.children[0].material.uniforms.uA.value=.45+.4*Math.sin(timeT*26);}
    else{const k=1-Math.max(0,e.t)/sweepT;ang=e.la0+e.ls*e.lsw*k;teleStrip.children[0].material.uniforms.uA.value=1;
      const rx=P.x-e.x,rz=P.z-e.z,fw=rx*Math.sin(ang)+rz*Math.cos(ang),sd=Math.abs(rx*Math.cos(ang)-rz*Math.sin(ang));
      if(!P.dead&&fw>0&&fw<14&&sd<1.0)hurtPlayer(2,e.x,e.z);
      if(Math.random()<dt*60){const dd=Math.random()*12;emit(e.x+Math.sin(ang)*dd,1,e.z+Math.cos(ang)*dd,1,'#ffb050',2,.4,.1,0);}
      FX.shake=Math.max(FX.shake,.12);
    }
    e.face=ang;teleStrip.position.set(e.x,.05,e.z);teleStrip.rotation.y=ang;
    if(e.t<=0){teleStrip.visible=false;goStun(e,1.7);}
    return [-1.6,-1.6];
  }
  return _bossExtra2(e,dt,d,pa);
};

const lineOf=(cx,cz,a,n,gap,r,delay,col,vis,skipNear)=>{
  for(let i=-n;i<=n;i++){if(skipNear&&Math.abs(i)<skipNear)continue;const x=cx+Math.sin(a)*i*gap,z=cz+Math.cos(a)*i*gap;if(!blocked(x,z,.2))bur(x,z,r,delay,col,1,vis);}
};

/* ============ état de jeu, joueur, ennemis, boss ============ */

/* ---------- dégâts ---------- */
function hurtPlayer(n,fx,fz){
  if(P.dead||P.inv>0||P.rollT>.05||G.state!=='play')return false;
  n=Math.max(1,Math.round(n*dmgMul(G.level)));
  P.hp=Math.max(0,P.hp-n);P.inv=1.1;G.hits++;
  FX.hurt=1;FX.shake=Math.max(FX.shake,.5);FX.hitstop=.07;
  const dx=P.x-fx,dz=P.z-fz,d=Math.hypot(dx,dz)||1;P.kx=dx/d*8;P.kz=dz/d*8;
  if(P.at>=0){P.at=-1;P.queued=false;if(slashArc)slashArc.visible=false;}
  Snd.hurt(fx,fz,n);emit(P.x,1.1,P.z,14,'#ff5a3a',4,.5,.1,8);
  try{if(navigator.vibrate)navigator.vibrate(40);}catch(e){}
  updateHearts();
  if(P.hp<=0)die();
  return true;
}
function die(){
  P.dead=true;G.deadT=1.6;FX.slow=.35;
  P.m.g.rotation.x=-1.45;P.m.g.position.y=.25;
  banner('Tu es tombé','Les cendres te réclament',2400);
  Snd.target=0;
}
function frontal(e,fx,fz){return Math.abs(angDiff(e.face,Math.atan2(fx-e.x,fz-e.z)))<1.15;}
let armorTip=false;
function sealBossDoor(on){
  if(!doorObj||!doorObj.opening)return;
  if(on&&!doorObj.shut){doorObj.shut=true;doorObj.mat.uniforms.uColor.value.set(CUR.warn);Snd.door(doorObj.x,doorObj.z);toast('La porte se scelle derrière toi : il n’y a plus de fuite.');}
  else if(!on&&doorObj.shut){doorObj.shut=false;doorObj.mat.uniforms.uColor.value.set('#4cff9a');}
}
function hitEnemy(e,n,fx,fz,kb){
  if(e.dead||e.invis)return;
  let blockedHit=false;
  if(e.froz>0&&e.kind!=='boss'){n*=2;e.froz=0;e.hold=0;e.stun=0;emit(e.x,1,e.z,14,'#dff0ff',5,.5,.1,8);}
  if(e.kind==='boss'){
    if(e.state==='sleep'||e.state==='intro'||e.state==='dying')return;
    if(e.state==='stun')n=Math.ceil(n*1.6);
    else if(e.def.armor&&frontal(e,fx,fz)){n=1;blockedHit=true;}
  }else if(e.armor&&frontal(e,fx,fz)){n=1;blockedHit=true;}
  e.hp-=n;e.flash=1;
  const dx=e.x-fx,dz=e.z-fz,d=Math.hypot(dx,dz)||1;
  if(blockedHit){
    Snd.clink(e.x,e.z);emit(e.x+Math.sin(e.face)*.5,1,e.z+Math.cos(e.face)*.5,8,'#d8e4f0',4,.3,.07,8);
    if(!armorTip){armorTip=true;toast('Sa carapace encaisse les coups de face. Frappe-le par derrière !');}
  }
  if(e.kind!=='boss'){
    const k=blockedHit?kb*.3:kb*(e.kbm==null?1:e.kbm);
    e.vx=dx/d*k;e.vz=dz/d*k;{const ns=blockedHit?.1:(e.stunT==null?.3:e.stunT);e.stun=e.hold>0?Math.max(e.stun,ns):ns;}
    if(!blockedHit&&(e.state==='wind'||e.state==='strike'||e.state==='leap'||e.state==='lunge')&&e.kind!=='golem'){
      e.state='chase';e.cd=.7;e.warn=0;for(const u of e.fu)u.uWarn.value=0;
      if(e.body&&e.kind!=='slime'&&e.kind!=='jelly'&&e.kind!=='mage')e.body.position.y=0;
    }
    if(e.state==='idle')e.state=e.kind==='slime'?'hunt':'chase';
  }
  if(!blockedHit)Snd.hit(e.x,e.z,n>1);
  emit(e.x,1,e.z,10,e.kind==='boss'?e.def.fx:(e.hitCol||'#e8dfc8'),5,.5,.09,9);
  if(e.hp<=0){killEnemy(e);}
  else if(e.kind==='boss'){
    updateBossBar();
    if(e.phase===1&&e.hp<=e.maxhp*.5){
      e.phase=2;Snd.roar(e.x,e.z);FX.shake=1;banner(e.def.p2[0],e.def.p2[1],2600);
      emit(e.x,1.5,e.z,40,e.def.fx,8,1,.18,-1);
    }
  }
}
function killEnemy(e){
  if(e.kind==='boss'){startBossDeath(e);return;}
  e.dead=true;G.kills++;world.remove(e.g);if(e.halo)flames=flames.filter(f=>f!==e.halo);
  const D=DIE[e.dk||e.kind]||DIE.skel;
  emit(e.x,D.y,e.z,D.n,D.c,D.v,D.l,D.s,D.g);Snd[D.snd](e.x,e.z);
  FX.fl=.25;FX.flx=e.x;FX.flz=e.z;FX.flc=D.fl;
  if(Math.random()<(P.hp<=2?.55:.22))spawnHeart(e.x,e.z);
  if(!G.keySpawned&&!enemies.some(x=>!x.dead&&x.room===L.keyRoom.id)){
    const kr=L.keyRoom;G.keySpawned=true;spawnKey(kr.cx,kr.cz);Snd.keyAppear(kr.cx,kr.cz);
    banner('Une clé apparaît','Elle ouvre la porte scellée',3000);

}
function breakPot(p){
